<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강의실 입장 — Spec Driven Development with Kiro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#0a0a1a;color:#fff;display:flex;align-items:center;justify-content:center;}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(147,197,253,.2);border-radius:20px;padding:44px 40px;width:100%;max-width:380px;text-align:center;}
.logo{font-size:14px;font-weight:700;letter-spacing:.06em;color:#93C5FD;margin-bottom:20px;text-transform:uppercase;}
h1{font-size:22px;font-weight:800;margin-bottom:6px;}
p{font-size:14px;color:rgba(255,255,255,.55);margin-bottom:28px;line-height:1.6;}
.pin-wrap{display:flex;gap:10px;justify-content:center;margin-bottom:28px;}
.pin-wrap input{width:54px;height:64px;border-radius:12px;border:2px solid rgba(147,197,253,.3);background:rgba(255,255,255,.06);color:#fff;font-size:26px;font-weight:800;text-align:center;font-family:'Pretendard',sans-serif;outline:none;transition:border-color .2s;}
.pin-wrap input:focus{border-color:#93C5FD;}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#1E40AF,#7C3AED);color:#fff;font-family:'Pretendard',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;}
.btn:hover{opacity:.88;}
.err{display:none;color:#f87171;font-size:13px;margin-top:12px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Spec Driven Development with Kiro</div>
  <h1>세션 번호 입력</h1>
  <p>강사로부터 받은 4자리 세션 번호를 입력해 주세요.</p>
  <div class="pin-wrap">
    <input type="password" inputmode="numeric" maxlength="1" id="d0" pattern="[0-9]">
    <input type="password" inputmode="numeric" maxlength="1" id="d1" pattern="[0-9]">
    <input type="password" inputmode="numeric" maxlength="1" id="d2" pattern="[0-9]">
    <input type="password" inputmode="numeric" maxlength="1" id="d3" pattern="[0-9]">
  </div>
  <button class="btn" onclick="checkPin()">입장하기</button>
  <p class="err" id="errMsg">세션 번호가 올바르지 않습니다.</p>
</div>
<script>
var PINS=['1105','1106']; // ← 유효한 세션 번호 목록
var inputs=document.querySelectorAll('.pin-wrap input');
inputs.forEach(function(inp,i){
  inp.addEventListener('input',function(){
    if(this.value.length===1&&i<inputs.length-1) inputs[i+1].focus();
  });
  inp.addEventListener('keydown',function(e){
    if(e.key==='Backspace'&&!this.value&&i>0) inputs[i-1].focus();
  });
});
inputs[0].focus();
function checkPin(){
  var entered=Array.from(inputs).map(function(i){return i.value;}).join('');
  if(PINS.indexOf(entered)!==-1){
    sessionStorage.setItem('sddAccess','1');
    location.href='./learn/day1/';
  } else {
    document.getElementById('errMsg').style.display='block';
    inputs.forEach(function(i){i.value='';});
    inputs[0].focus();
  }
}
document.addEventListener('keydown',function(e){if(e.key==='Enter')checkPin();});
</script>
</body>
</html>
