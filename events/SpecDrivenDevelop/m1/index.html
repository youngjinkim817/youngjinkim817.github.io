.themebtn{margin-left:auto;width:34px;height:34px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);color:var(--t1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;}
.themebtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;}

.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px);}
aside{border-right:1px solid var(--border);padding:18px 12px;overflow-y:auto;position:sticky;top:64px;height:calc(100vh - 64px);background:var(--bg);display:flex;flex-direction:column;gap:4px;}
html.dark aside{border-right-color:#1e3a5f;}
.navday{margin-bottom:2px;}.navday-hd{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;transition:background .15s;}.navday-hd:hover{background:var(--tag);}
.navday-toggle{background:transparent;border:none;cursor:pointer;padding:2px;display:flex;align-items:center;flex-shrink:0;margin-top:1px;}
.navday-link{flex:1;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;}
.navday-arr{width:14px;height:14px;flex-shrink:0;margin-top:3px;color:var(--t3);transition:transform .22s ease;fill:none;stroke:currentColor;stroke-width:2.5;}

.navday-badge{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--secondary);}

html.dark .navday-body{border-left-color:#1e3a5f;}
.nav-module{display:block;padding:7px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--t1);border-left:2px solid transparent;text-decoration:none;transition:background .15s;}

.sticknav button{background:var(--bg-soft);border:1px solid var(--border);color:var(--t1);padding:7px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;font-family:inherit;}

.sticknav button:disabled{opacity:.35;cursor:default;}

html.dark *{--border:#1e3a5f !important;}
html.dark body,html.dark aside,html.dark main,html.dark .sticknav{background-color:#0a0a0f;}

html.dark .sticknav-cnt{color:#C4B5FD !important;}
</style>

<script>
var NOTES = [
  {t:'Module 1 · AWS Cloud — AWS Cloud 소개', h:`
<div class="note-section"><div class="note-section-title">모듈 개요</div>
<p>이 모듈에서는 <span class="note-kw">AWS 클라우드</span>의 핵심 인프라와 서비스, 그리고 최신 <span class="note-kw">생성형 AI(Generative AI)</span> 기술의 흐름을 다룹니다. 클라우드 컴퓨팅이 무엇인지, AWS가 어떻게 전 세계 인프라를 구성하는지, 그리고 AI·ML이 어떻게 진화해 오늘날의 에이전트 AI 시대에 이르렀는지를 이해합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">클라우드 컴퓨팅이란</div>
<p><span class="note-kw">클라우드 컴퓨팅</span>이란 컴퓨터 자원(서버·스토리지·네트워크·소프트웨어)을 인터넷을 통해 <span class="note-kw">온디맨드(on-demand)</span>로 제공받고, 사용한 만큼만 비용을 지불하는 방식입니다. 서버를 직접 구매하고 유지할 필요 없이, 필요한 순간에 즉시 자원을 늘리거나 줄일 수 있습니다.</p>
<ul>
  <li><strong>온디맨드 셀프서비스</strong>: 사람의 개입 없이 자동으로 컴퓨팅 자원을 프로비저닝</li>
  <li><strong>광대역 네트워크</strong>: 어디서든 인터넷으로 접근</li>
  <li><strong>탄력적 규모 조정</strong>: 트래픽에 따라 자원을 자동 확장·축소</li>
  <li><strong>사용량 기반 과금</strong>: 쓴 만큼만 지불(초 단위 과금 지원)</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">학습 목표</div>
<ul>
  <li>AWS 글로벌 인프라(리전·가용영역) 구조 이해</li>
  <li>컴퓨팅·스토리지·네트워킹 핵심 서비스 파악</li>
  <li>생성형 AI와 파운데이션 모델의 개념 및 한계 이해</li>
  <li>Amazon Bedrock 플랫폼과 에이전트 개념 소개</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">왜 지금 클라우드인가</div>
<p>AI 모델 학습에는 수천 개의 GPU가 필요하고, 추론 서비스는 트래픽에 따라 수십 배 규모가 달라집니다. 클라우드는 이런 폭발적 자원 수요를 <strong>자본 지출 없이 운영 비용으로</strong> 처리할 수 있게 합니다. AI 시대에 클라우드는 선택이 아닌 필수입니다.</p>
</div>`},

  {t:'Global Infrastructure — AWS 글로벌 인프라', h:`
<div class="note-section"><div class="note-section-title">AWS 글로벌 인프라 현황</div>
<p>AWS는 2026년 현재 전 세계 <span class="note-kw">39개 지리적 리전(Region)</span>에 <span class="note-kw">124개 이상의 가용 영역(Availability Zone)</span>을 운영하는 세계 최대 클라우드 인프라를 보유하고 있습니다. 이 규모는 어떤 경쟁사보다 더 많은 지역에 더 많은 시설을 갖추고 있음을 의미합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">인프라 계층 구조</div>
<ul>
  <li><strong>리전(Region)</strong>: 지리적으로 분리된 물리적 위치. 예) 서울(ap-northeast-2), 도쿄, 버지니아. 각 리전은 서로 완전히 독립적이며, 데이터는 기본적으로 선택한 리전을 벗어나지 않습니다.</li>
  <li><strong>가용 영역(AZ)</strong>: 리전 내 물리적으로 분리된 데이터 센터 그룹. 각 AZ는 독립적인 전력·냉각·네트워크를 가지며, 단일 장애가 다른 AZ에 영향을 주지 않습니다. 리전당 평균 3~6개 AZ.</li>
  <li><strong>엣지 로케이션(Edge Location)</strong>: 전 세계 600개 이상. CloudFront CDN, Route 53 DNS가 여기서 동작해 최종 사용자 가까이서 콘텐츠를 제공합니다.</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">설계 원칙</div>
<p>고가용성 시스템 설계 시 반드시 <strong>멀티 AZ 배포</strong>를 고려합니다. 두 개 이상의 AZ에 서버를 분산 배치하면 하나의 AZ 장애 시 서비스가 자동으로 다른 AZ로 전환됩니다. 금융·의료 등 미션 크리티컬 서비스는 멀티 리전 배포까지 고려합니다.</p>
</div>
<div class="note-case"><div class="note-case-label">데이터 주권(Data Sovereignty)</div>
<p>EU의 GDPR, 한국의 개인정보보호법처럼 데이터를 특정 국가 내에 보관해야 하는 규정이 늘고 있습니다. AWS 리전 선택으로 <strong>데이터가 해당 국가 내에서만 처리·저장</strong>되도록 보장할 수 있습니다. 서울 리전(ap-northeast-2)을 선택하면 데이터는 한국 내 데이터 센터에만 저장됩니다.</p>
</div>`},

  {t:'Region &amp; Availability Zone — 리전과 가용 영역', h:`
<div class="note-section"><div class="note-section-title">리전(Region) 이해하기</div>
<p>리전은 AWS의 지리적 운영 단위입니다. 각 리전은 독립적이며, 한 리전의 서비스 장애가 다른 리전에 영향을 미치지 않습니다. 서비스 선택 시 가장 먼저 리전을 선택해야 합니다.</p>
<p><strong>리전 선택 기준:</strong></p>
<ul>
  <li><strong>지연 시간(Latency)</strong>: 사용자와 가까운 리전 선택 → 한국 사용자라면 서울(ap-northeast-2)</li>
  <li><strong>규정 준수</strong>: 데이터 거주 요건이 있다면 해당 국가 리전 선택</li>
  <li><strong>서비스 가용성</strong>: 일부 신규 서비스는 특정 리전에서만 제공됨</li>
  <li><strong>비용</strong>: 리전마다 서비스 가격이 다름 (버지니아가 일반적으로 가장 저렴)</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">가용 영역(AZ) 이해하기</div>
<p>가용 영역은 리전 내에서 물리적으로 분리된 데이터 센터 클러스터입니다. 서울 리전(ap-northeast-2)에는 ap-northeast-2a, 2b, 2c, 2d 등 4개의 AZ가 있습니다.</p>
<ul>
  <li>각 AZ는 독립적인 전력 공급, 냉각 시스템, 네트워크를 보유</li>
  <li>AZ 간 거리는 수십 km 이상 — 자연재해 등 물리적 재난에 대비</li>
  <li>AZ 간 네트워크는 전용 저지연 광케이블로 연결 (왕복 1~2ms)</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">실습 포인트 — 고가용성 구성</div>
<p>오늘 개인 프로젝트에서 웹사이트를 배포할 때, 서울 리전을 선택하면 한국 사용자에게 최적의 속도를 제공합니다. Amazon EC2 Auto Scaling을 사용하면 AZ 장애 시 자동으로 다른 AZ에 인스턴스가 생성됩니다.</p>
</div>`},

  {t:'Core Technologies — AWS 핵심 기술', h:`
<div class="note-section"><div class="note-section-title">AWS 서비스 포트폴리오</div>
<p>AWS는 현재 200개 이상의 클라우드 서비스를 제공합니다. 크게 <span class="note-kw">컴퓨팅 · 스토리지 · 데이터베이스 · 네트워킹 · 보안 · AI/ML · 개발자 도구</span> 카테고리로 분류됩니다. 처음에는 모든 서비스를 알 필요가 없으며, 핵심 기반 서비스를 이해한 후 필요에 따라 확장해 나가는 것이 효과적입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">핵심 서비스 카테고리</div>
<ul>
  <li><strong>컴퓨팅</strong>: EC2(가상 서버), Lambda(서버리스), ECS/EKS(컨테이너) — 코드를 실행하는 두뇌</li>
  <li><strong>스토리지</strong>: S3(객체), EBS(블록), EFS(파일) — 데이터를 저장하는 창고</li>
  <li><strong>데이터베이스</strong>: RDS(관계형), DynamoDB(NoSQL), ElastiCache(인메모리) — 데이터를 조회·관리하는 엔진</li>
  <li><strong>네트워킹</strong>: VPC(가상 네트워크), Route 53(DNS), CloudFront(CDN) — 데이터가 이동하는 도로</li>
  <li><strong>보안</strong>: IAM(신원 관리), KMS(암호화), Shield(DDoS 방어) — 자원을 보호하는 경비원</li>
  <li><strong>AI/ML</strong>: Bedrock(FM 플랫폼), SageMaker(ML 플랫폼), Rekognition(이미지 인식) — 지능을 부여하는 두뇌</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">웹사이트 하나를 만드는 데 필요한 서비스</div>
<p>간단한 웹사이트: <strong>EC2</strong>(웹 서버) + <strong>RDS</strong>(데이터베이스) + <strong>S3</strong>(이미지 저장) + <strong>CloudFront</strong>(CDN) + <strong>Route 53</strong>(도메인) + <strong>IAM</strong>(권한 관리). 오늘 Kiro로 만드는 웹사이트도 이 구성을 기반으로 합니다.</p>
</div>`},

  {t:'Compute — 컴퓨팅 서비스', h:`
<div class="note-section"><div class="note-section-title">Amazon EC2 (Elastic Compute Cloud)</div>
<p><span class="note-kw">EC2</span>는 AWS의 가상 서버 서비스입니다. 수백 가지의 <strong>인스턴스 타입</strong>으로 CPU·메모리·GPU·네트워크 조합을 선택할 수 있습니다. Linux·Windows 다양한 OS를 지원합니다.</p>
<ul>
  <li><strong>범용(T, M)</strong>: 웹 서버, 소규모 DB — 가장 많이 사용됨</li>
  <li><strong>컴퓨팅 최적화(C)</strong>: 게임 서버, 과학 시뮬레이션</li>
  <li><strong>메모리 최적화(R, X)</strong>: 대용량 인메모리 DB, 빅데이터</li>
  <li><strong>GPU 인스턴스(P, G)</strong>: AI/ML 학습·추론, 그래픽 렌더링</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">AWS Lambda — 서버리스 컴퓨팅</div>
<p><span class="note-kw">Lambda</span>는 서버를 관리하지 않고 코드만 업로드하면 AWS가 자동으로 실행하는 <strong>서버리스(Serverless)</strong> 서비스입니다. 이벤트(HTTP 요청, S3 파일 업로드 등)가 발생할 때만 코드가 실행되고, 실행 시간(밀리초 단위) + 요청 수에 따라 과금됩니다.</p>
<ul>
  <li>최대 실행 시간: 15분</li>
  <li>지원 언어: Python, Node.js, Java, Go, .NET 등</li>
  <li>무료 티어: 월 100만 요청 무료</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">컨테이너 서비스 — ECS & EKS</div>
<p><span class="note-kw">Amazon ECS</span>(Elastic Container Service)와 <span class="note-kw">Amazon EKS</span>(Elastic Kubernetes Service)는 Docker 컨테이너를 관리하는 서비스입니다. 마이크로서비스 아키텍처, CI/CD 파이프라인에 활용됩니다.</p>
</div>
<div class="note-tip"><div class="note-tip-label">무엇을 선택할까</div>
<p>장기 실행 웹 서버 → <strong>EC2</strong>. 단발성 이벤트 처리, API 백엔드 → <strong>Lambda</strong>. 컨테이너 기반 마이크로서비스 → <strong>ECS/EKS</strong>. 오늘 Kiro로 웹사이트를 만들면 Lambda + API Gateway 조합이 가장 빠르게 배포됩니다.</p>
</div>`},

  {t:'Storage — 스토리지 서비스', h:`
<div class="note-section"><div class="note-section-title">Amazon S3 (Simple Storage Service)</div>
<p><span class="note-kw">S3</span>는 AWS의 핵심 객체 스토리지 서비스입니다. 파일(객체)을 버킷(Bucket)에 저장하며 용량 제한이 없습니다. 객체 하나의 최대 크기는 5TB이며, 연간 99.999999999%(eleven nines) 내구성을 보장합니다.</p>
<ul>
  <li><strong>정적 웹사이트 호스팅</strong>: HTML·CSS·JS 파일을 S3에 올리면 웹사이트로 서빙 가능</li>
  <li><strong>데이터 레이크</strong>: AI/ML 학습용 대용량 데이터 저장</li>
  <li><strong>백업 및 아카이빙</strong>: Glacier 스토리지 클래스로 저렴하게 장기 보관</li>
  <li><strong>이미지·동영상 저장</strong>: CloudFront CDN과 연동해 글로벌 빠른 배포</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Amazon EBS — 블록 스토리지</div>
<p><span class="note-kw">EBS</span>(Elastic Block Store)는 EC2 인스턴스에 연결하는 SSD/HDD 디스크입니다. 데이터베이스나 운영체제 디스크로 사용됩니다. EC2 인스턴스가 종료되어도 EBS의 데이터는 유지됩니다.</p>
</div>
<div class="note-section"><div class="note-section-title">Amazon EFS — 파일 시스템</div>
<p><span class="note-kw">EFS</span>(Elastic File System)는 여러 EC2 인스턴스가 동시에 마운트해 공유할 수 있는 NFS 파일 시스템입니다. 컨테이너 환경에서 공유 스토리지가 필요할 때 활용됩니다.</p>
</div>
<div class="note-case"><div class="note-case-label">S3 vs EBS vs EFS 선택 기준</div>
<p><strong>S3</strong>: 이미지·파일·로그 저장 (객체 스토리지, 웹에서 직접 접근). <strong>EBS</strong>: 단일 EC2의 OS 디스크, DB 데이터 파일. <strong>EFS</strong>: 여러 서버가 공유해야 하는 설정 파일, 공유 콘텐츠.</p>
</div>`},

  {t:'Networking — 네트워킹 서비스', h:`
<div class="note-section"><div class="note-section-title">Amazon VPC (Virtual Private Cloud)</div>
<p><span class="note-kw">VPC</span>는 AWS 클라우드 안에 논리적으로 격리된 가상 네트워크를 만드는 서비스입니다. 마치 회사 내부 네트워크처럼 IP 주소 범위, 서브넷, 라우팅 규칙, 보안 그룹을 직접 설계할 수 있습니다.</p>
<ul>
  <li><strong>퍼블릭 서브넷</strong>: 인터넷에서 직접 접근 가능 — 웹 서버 배치</li>
  <li><strong>프라이빗 서브넷</strong>: 인터넷 직접 접근 불가 — DB, 내부 서버 배치</li>
  <li><strong>보안 그룹(Security Group)</strong>: 인스턴스 단위의 방화벽 — 포트별 인바운드·아웃바운드 허용 규칙</li>
  <li><strong>NAT Gateway</strong>: 프라이빗 서브넷 서버가 인터넷으로 나가는 출구</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Amazon Route 53 — DNS 서비스</div>
<p><span class="note-kw">Route 53</span>은 AWS의 관리형 DNS(Domain Name System) 서비스입니다. 도메인 이름을 IP 주소로 변환하고, 트래픽 라우팅 정책(지리적 라우팅, 가중치 라우팅, 장애 조치 라우팅)을 설정할 수 있습니다.</p>
</div>
<div class="note-section"><div class="note-section-title">Amazon CloudFront — CDN</div>
<p><span class="note-kw">CloudFront</span>는 전 세계 600개 이상의 엣지 로케이션에서 콘텐츠를 캐싱·배포하는 CDN(Content Delivery Network) 서비스입니다. S3에 저장된 정적 파일을 사용자 가까운 곳에서 제공해 지연 시간을 획기적으로 줄입니다.</p>
</div>
<div class="note-tip"><div class="note-tip-label">프로젝트 적용 — 웹사이트 아키텍처</div>
<p>오늘 만들 웹사이트: <strong>Route 53</strong>(도메인) → <strong>CloudFront</strong>(CDN·HTTPS) → <strong>S3</strong>(정적 파일) 또는 <strong>EC2/Lambda</strong>(동적 API). 이 패턴이 AWS에서 가장 일반적인 웹 호스팅 아키텍처입니다.</p>
</div>`},

  {t:'AWS AI — AWS AI 스택', h:`
<div class="note-section"><div class="note-section-title">AWS AI — 실리콘에서 에이전트까지</div>
<p>AWS는 AI 개발에 필요한 모든 레이어를 수직 통합하여 제공합니다. <span class="note-kw">칩·인프라 → FM 플랫폼 → AI 서비스 → 에이전트 솔루션</span>으로 이어지는 완전한 AI 스택입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">레이어별 주요 서비스</div>
<ul>
  <li><strong>AI 칩·인프라</strong>: AWS Trainium(ML 학습용 칩), AWS Inferentia(추론 최적화 칩) — 일반 GPU보다 높은 가격 대비 성능</li>
  <li><strong>FM 플랫폼(Amazon Bedrock)</strong>: 다양한 파운데이션 모델을 단일 API로 — Claude, Llama, Titan, Stable Diffusion 등</li>
  <li><strong>ML 플랫폼(Amazon SageMaker)</strong>: 자체 ML 모델 빌드·학습·배포·모니터링</li>
  <li><strong>AI 서비스</strong>: 코딩 없이 바로 사용하는 특화 AI — Rekognition(이미지 인식), Textract(문서 OCR), Polly(TTS), Transcribe(STT), Translate(번역)</li>
  <li><strong>에이전트 솔루션</strong>: Bedrock Agents, Amazon Q(기업용 AI 어시스턴트)</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">Kiro와 AWS AI의 관계</div>
<p>Kiro는 내부적으로 <strong>Amazon Bedrock</strong>과 통합되어 Claude 등의 FM을 사용해 코드를 생성하고 작업을 실행합니다. 따라서 Kiro를 사용하는 것 자체가 AWS AI 스택을 활용하는 것입니다.</p>
</div>`},

  {t:'AI 개념 — 생성형 AI의 발전 과정', h:`
<div class="note-section"><div class="note-section-title">AI 기술의 계층적 구조</div>
<p>AI 관련 용어들은 서로 포함 관계에 있습니다. <span class="note-kw">AI ⊃ 머신러닝 ⊃ 딥러닝 ⊃ 생성형 AI</span> 순서로 더 넓은 개념 안에 좁은 개념이 포함됩니다.</p>
<ul>
  <li><strong>AI (Artificial Intelligence)</strong>: 인간의 지능적 행동을 컴퓨터로 모방하는 모든 기술. 규칙 기반 시스템부터 신경망까지 포함.</li>
  <li><strong>ML (Machine Learning)</strong>: 명시적 프로그래밍 없이 데이터에서 패턴을 스스로 학습하는 AI 하위 분야. 스팸 필터, 추천 알고리즘 등.</li>
  <li><strong>DL (Deep Learning)</strong>: 수십~수백 층의 인공신경망을 사용하는 ML. 이미지 인식, 음성 인식에서 혁명적 성과.</li>
  <li><strong>생성형 AI (Generative AI)</strong>: 새로운 콘텐츠(텍스트·이미지·코드·음악·동영상)를 창조하는 AI. GPT, Claude, Stable Diffusion 등.</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">트랜스포머(Transformer)의 등장</div>
<p>2017년 Google이 발표한 <span class="note-kw">Transformer 아키텍처</span>는 현대 생성형 AI의 기반입니다. "Attention is All You Need" 논문에서 제안된 <strong>Self-Attention 메커니즘</strong>은 문장 내 단어들의 관계를 병렬로 처리해 NLP(자연어 처리)의 성능을 획기적으로 향상시켰습니다. GPT, BERT, Claude 모두 Transformer 기반입니다.</p>
</div>
<div class="note-case"><div class="note-case-label">일상에서 만나는 AI 기술</div>
<p>스팸 필터(ML) → 유튜브 추천(ML) → 이미지 인식(DL) → ChatGPT·Claude(생성형 AI) → Kiro 코딩 에이전트(에이전트 AI). 우리는 이미 매일 여러 레이어의 AI를 사용하고 있습니다.</p>
</div>`},

  {t:'ML vs Foundation Model — 전통 ML vs FM', h:`
<div class="note-section"><div class="note-section-title">전통적 머신러닝 모델의 방식</div>
<p>전통적 ML은 <span class="note-kw">특정 작업(Task)마다 별도의 모델을 학습</span>합니다. 감성 분석 모델, 이미지 분류 모델, 번역 모델이 모두 별개로 존재합니다.</p>
<ul>
  <li>레이블된(labeled) 대량의 학습 데이터 필요</li>
  <li>특정 작업에서는 높은 성능, 다른 작업에는 전혀 사용 불가</li>
  <li>새 작업 = 새 모델 학습 → 높은 비용과 시간</li>
  <li>도메인 지식을 가진 ML 엔지니어 필요</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">파운데이션 모델(FM)의 혁신</div>
<p><span class="note-kw">파운데이션 모델(Foundation Model)</span>은 방대한 비지도 데이터로 사전 학습(Pre-training)된 대형 모델입니다. <strong>하나의 모델이 다양한 작업</strong>에 적용될 수 있어 개발 비용과 시간을 획기적으로 줄입니다.</p>
<ul>
  <li>별도 학습 없이 프롬프트만으로 새 작업 수행 (Zero-shot, Few-shot)</li>
  <li>언어·코드·이미지 등 다양한 모달리티 지원</li>
  <li>미세 조정(Fine-tuning)으로 특정 도메인 성능 향상 가능</li>
  <li>파라미터 수: GPT-4 ~1.8조, Claude 3 Opus ~2조 추정</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">비용 혁명</div>
<p>기업이 자체 ML 모델을 학습시키려면 수백~수천만 달러의 비용이 필요합니다. FM을 API로 호출하면 <strong>토큰당 몇 분의 1센트</strong>로 동일한 수준의 AI를 사용할 수 있습니다. Bedrock을 통해 Claude Sonnet 호출 시 입력 1K 토큰에 약 $0.003, 출력 1K 토큰에 $0.015(2024년 기준).</p>
</div>`},

  {t:'Foundation Model — 파운데이션 모델', h:`
<div class="note-section"><div class="note-section-title">파운데이션 모델의 특성</div>
<p><span class="note-kw">파운데이션 모델</span>은 인터넷 규모의 텍스트, 코드, 이미지 등 방대한 비지도 데이터로 사전 학습된 대규모 신경망 모델입니다. "파운데이션(Foundation, 기반)"이라는 이름처럼, 다양한 AI 애플리케이션의 기반이 됩니다.</p>
</div>
<div class="note-section"><div class="note-section-title">핵심 능력</div>
<ul>
  <li><strong>In-context Learning</strong>: 프롬프트 내 몇 가지 예시만 보여주면 즉시 새 패턴을 학습해 적용</li>
  <li><strong>Zero-shot / Few-shot</strong>: 별도 학습 없이(Zero-shot) 또는 소수 예시만으로(Few-shot) 새 작업 수행</li>
  <li><strong>Chain-of-Thought</strong>: 단계별 추론 과정을 프롬프트로 유도하면 복잡한 문제도 해결 가능</li>
  <li><strong>멀티모달(Multimodal)</strong>: 텍스트, 이미지, 오디오, 코드 등 복합 입력 처리 (Claude 3 Vision, GPT-4o 등)</li>
  <li><strong>컨텍스트 윈도우</strong>: 한 번에 처리 가능한 입력 길이. Claude 3.5 기준 200K 토큰(약 150만 단어)</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Bedrock에서 사용 가능한 주요 FM</div>
<ul>
  <li><strong>Anthropic Claude</strong>: 대화·코드·분석에 강함. AWS에서 가장 많이 사용</li>
  <li><strong>Meta Llama</strong>: 오픈 웨이트 모델. 커스터마이징 가능</li>
  <li><strong>Amazon Titan</strong>: AWS 자체 개발 모델. 텍스트·임베딩</li>
  <li><strong>Stability AI</strong>: 이미지 생성 (Stable Diffusion)</li>
  <li><strong>DeepSeek</strong>: 코딩 및 추론에 특화된 오픈 모델</li>
</ul>
</div>`},

  {t:'Emergence — 창발(Emergence)', h:`
<div class="note-section"><div class="note-section-title">창발이란 무엇인가</div>
<p><span class="note-kw">창발(Emergence)</span>이란 개별 구성요소의 특성으로는 예측할 수 없는 <strong>새로운 특성이 규모가 커질 때 갑자기 나타나는 현상</strong>입니다. LLM에서는 모델의 파라미터 수가 특정 임계값을 초과할 때, 학습 데이터에 없던 새로운 능력이 갑자기 발현됩니다.</p>
</div>
<div class="note-section"><div class="note-section-title">창발적 능력의 사례</div>
<ul>
  <li><strong>산술 추론</strong>: 소형 모델은 덧셈도 틀리지만, 대형 모델은 복잡한 수학 문제를 해결</li>
  <li><strong>코드 실행 시뮬레이션</strong>: 코드를 실제 실행하지 않고 출력 결과를 예측</li>
  <li><strong>논리적 추론</strong>: 여러 단계의 논리 추론과 반사실적 사고</li>
  <li><strong>번역</strong>: 학습 데이터에 포함되지 않은 언어 쌍도 번역 가능</li>
  <li><strong>지시 따르기(Instruction Following)</strong>: 단순 텍스트 완성에서 복잡한 지시 수행으로</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">스케일링 법칙(Scaling Law)</div>
<p>OpenAI가 발견한 <strong>스케일링 법칙</strong>에 따르면, 모델 크기·데이터·컴퓨팅 파워를 늘릴수록 성능이 예측 가능하게 향상됩니다. 이 발견이 수조 달러의 AI 인프라 투자를 정당화했고, GPT-4·Claude 3 같은 초대형 모델이 탄생하게 됐습니다.</p>
</div>`},

  {t:'Challenges — 파운데이션 모델의 도전 과제', h:`
<div class="note-section"><div class="note-section-title">범용 FM의 한계</div>
<p>파운데이션 모델은 강력하지만, 실제 비즈니스 환경에서 그대로 사용하기에는 여러 한계가 있습니다. 이 한계들을 극복하는 것이 실용적 AI 서비스 구축의 핵심 과제입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">주요 도전 과제</div>
<ul>
  <li><strong>환각(Hallucination)</strong>: FM은 사실이 아닌 내용을 자신 있게 생성합니다. "2024년 대통령은 누구인가?"에 엉뚱한 답을 할 수 있습니다. 해결책: RAG(실시간 데이터 검색 연동)</li>
  <li><strong>지식 컷오프(Knowledge Cutoff)</strong>: 학습 데이터에는 마감일이 있어, 최신 정보를 모릅니다. 해결책: 실시간 검색 도구(Tool) 연동</li>
  <li><strong>도메인 특화 부족</strong>: 일반 학습 데이터로 사전 학습되어 특정 기업의 내부 지식을 모릅니다. 해결책: Fine-tuning 또는 RAG</li>
  <li><strong>컨텍스트 윈도우 제한</strong>: 한 번에 처리할 수 있는 입력 길이에 제한이 있습니다. 해결책: 청킹(Chunking), 요약(Summarization)</li>
  <li><strong>안전성·편향</strong>: 학습 데이터의 편향이 출력에 반영될 수 있고, 유해 콘텐츠를 생성할 수 있습니다. 해결책: Bedrock Guardrails, RLHF</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">실전 접근법</div>
<p>실제 서비스 구축 시 FM을 그대로 사용하지 않고, <strong>프롬프트 엔지니어링 → RAG → Fine-tuning</strong> 순서로 접근합니다. 비용과 복잡도가 낮은 것부터 시도해 보는 것이 좋습니다.</p>
</div>`},

  {t:'Limitation — 파운데이션 모델의 한계', h:`
<div class="note-section"><div class="note-section-title">LLM의 근본적 한계 — 행동(Action)의 부재</div>
<p>일반 LLM은 <span class="note-kw">정보를 안내</span>하지만 <span class="note-kw">실제 행동</span>을 하지 못합니다. "항공권을 예약해줘"라고 말하면 예약 방법을 알려주지만, 실제로 예약 시스템에 접근해 처리하지는 않습니다. 이것이 에이전트(Agent)가 등장한 이유입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">행동 불가 영역</div>
<ul>
  <li><strong>실시간 데이터 접근</strong>: 현재 날씨, 주가, 환율을 실시간으로 조회 불가</li>
  <li><strong>코드 실행</strong>: 코드를 생성할 수 있지만 직접 실행·검증 불가 (에이전트는 가능)</li>
  <li><strong>외부 시스템 연동</strong>: 이메일 발송, DB 업데이트, API 호출 불가</li>
  <li><strong>장기 작업</strong>: 복잡한 멀티 스텝 작업에서 오류 누적 및 컨텍스트 손실</li>
  <li><strong>자기 검증</strong>: 자신이 생성한 답의 정확성을 스스로 검증하는 데 한계</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">에이전트가 이 한계를 해결하는 방법</div>
<p><strong>도구(Tool) 사용</strong>: 에이전트는 검색 엔진, 코드 실행기, 데이터베이스, 외부 API를 도구로 연결해 실제 행동합니다. Kiro가 파일을 읽고, 코드를 실행하고, 오류를 수정하는 것이 바로 이 원리입니다. <strong>ReAct(Reasoning + Acting)</strong> 루프로 추론 → 행동 → 관찰 → 재추론을 반복합니다.</p>
</div>`},

  {t:'Patterns — Generative AI 구현 패턴', h:`
<div class="note-section"><div class="note-section-title">4가지 주요 구현 패턴</div>
<p>생성형 AI 애플리케이션은 크게 네 가지 패턴으로 구현됩니다. 복잡도와 비용이 낮은 것부터 높은 것 순서로 이해하면 좋습니다.</p>
</div>
<div class="note-section"><div class="note-section-title">패턴 상세</div>
<ul>
  <li><strong>프롬프트 엔지니어링</strong>: FM에 입력하는 프롬프트를 정교하게 작성해 출력 품질을 높이는 기법. 비용 없이 바로 시작 가능. System Prompt, Few-shot, Chain-of-Thought 등이 핵심 기법.</li>
  <li><strong>RAG (Retrieval-Augmented Generation)</strong>: FM의 지식 컷오프 한계를 극복. 질문에 관련된 문서를 벡터 DB에서 검색해 FM에 컨텍스트로 제공. 사내 문서 기반 QA, 법률·의료 도메인 챗봇에 필수.</li>
  <li><strong>에이전트(Agent)</strong>: FM + 도구(Tool) + 메모리. 다단계 복잡 작업을 자율 실행. Kiro가 대표적 코딩 에이전트.</li>
  <li><strong>파인튜닝/사전학습(Fine-tuning/Pre-training)</strong>: 특정 도메인 데이터로 모델 가중치를 추가 학습. 의료·법률처럼 전문 도메인에서 높은 성능 필요 시. 비용이 가장 높음.</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">오늘 실습 연결점</div>
<p>Kiro는 <strong>에이전트 패턴</strong>으로 동작합니다. 코드 생성(프롬프트 엔지니어링) + 파일 검색(RAG 유사) + 코드 실행(도구)을 모두 결합한 복합 패턴입니다. 여러분이 오늘 만드는 웹사이트도 이 패턴 중 하나를 선택해 AI 기능을 추가할 수 있습니다.</p>
</div>`},

  {t:'Agent — 에이전트 개요', h:`
<div class="note-section"><div class="note-section-title">AI 에이전트란</div>
<p><span class="note-kw">AI 에이전트(Agent)</span>는 목표를 달성하기 위해 <span class="note-kw">자율적으로 추론·계획·행동</span>하는 소프트웨어 시스템입니다. 단순히 질문에 답하는 것을 넘어, 도구를 사용하고, 환경을 관찰하며, 목표를 향해 반복적으로 행동합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">에이전트의 4가지 구성 요소</div>
<ul>
  <li><strong>LLM (두뇌)</strong>: 추론, 계획, 의사결정 담당. "다음에 무엇을 할까?" 결정</li>
  <li><strong>도구(Tools)</strong>: 에이전트가 사용할 수 있는 기능. 코드 실행기, 웹 검색, 파일 I/O, API 호출, DB 쿼리 등</li>
  <li><strong>메모리(Memory)</strong>: 단기 메모리(컨텍스트 윈도우) + 장기 메모리(벡터 DB, 파일 시스템)</li>
  <li><strong>계획(Planning)</strong>: 복잡한 목표를 작은 태스크로 분해. ReAct, Tree-of-Thought 등의 추론 전략</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">ReAct 루프 — 에이전트 동작 원리</div>
<p>에이전트는 <span class="note-kw">Reasoning(추론) → Acting(행동) → Observing(관찰)</span> 루프를 반복합니다. "index.html 파일을 수정해줘" 요청 시: 추론(파일 확인 필요) → 행동(파일 읽기 도구 실행) → 관찰(파일 내용 확인) → 추론(수정 계획) → 행동(파일 쓰기) → 관찰(성공 확인) → 완료.</p>
</div>
<div class="note-case"><div class="note-case-label">Kiro = 코딩 에이전트</div>
<p>Kiro는 파일 읽기·쓰기·삭제, 터미널 명령 실행, 웹 검색 도구를 가진 코딩 에이전트입니다. Kiro에게 "React 앱을 만들어줘"라고 하면 ReAct 루프로 파일 구조 설계 → 파일 생성 → npm install 실행 → 오류 수정을 자동으로 처리합니다.</p>
</div>`},

  {t:'Amazon Bedrock — 소개', h:`
<div class="note-section"><div class="note-section-title">Amazon Bedrock이란</div>
<p><span class="note-kw">Amazon Bedrock</span>은 선도적인 AI 기업의 파운데이션 모델을 <span class="note-kw">단일 API</span>로 액세스하고, 생성형 AI 애플리케이션을 구축·확장할 수 있는 <strong>완전 관리형 서비스</strong>입니다. 모델 인프라를 직접 관리하지 않아도 됩니다.</p>
</div>
<div class="note-section"><div class="note-section-title">핵심 기능</div>
<ul>
  <li><strong>Model Access</strong>: Claude, Llama, Titan, Stable Diffusion, Cohere 등 다양한 FM을 단일 API로</li>
  <li><strong>Knowledge Base</strong>: S3의 문서를 벡터 DB에 자동 임베딩해 RAG 파이프라인 구축. 관리형 OpenSearch, Pinecone, Aurora 등 연동</li>
  <li><strong>Agents</strong>: FM + Lambda 함수(도구) + Knowledge Base를 연결하는 관리형 에이전트 런타임</li>
  <li><strong>Guardrails</strong>: 유해 콘텐츠 필터, 개인정보 마스킹, 주제 제한 등 안전 레이어</li>
  <li><strong>Model Evaluation</strong>: 모델 응답 품질을 자동·수동으로 평가</li>
  <li><strong>Fine-tuning</strong>: Titan 등 일부 모델을 자체 데이터로 미세 조정</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">Bedrock vs SageMaker 선택 기준</div>
<p><strong>Bedrock</strong>: 기존 FM을 그대로 또는 RAG/에이전트로 활용. 인프라 관리 불필요. 빠른 시작. <strong>SageMaker</strong>: 자체 ML 모델을 처음부터 학습시키거나 배포. 더 높은 제어권이 필요할 때. 오늘 실습처럼 Kiro로 앱을 만들 때는 Bedrock이 적합합니다.</p>
</div>`},

  {t:'Model Choice — 최적의 FM 선택', h:`
<div class="note-section"><div class="note-section-title">FM 선택의 중요성</div>
<p>Bedrock에서는 수십 개의 FM 중 작업에 맞는 모델을 선택해야 합니다. 모델 선택은 응답 품질, 처리 속도, 비용에 직접적인 영향을 미칩니다. "최고 성능 모델이 항상 최선"이 아니라, <span class="note-kw">작업에 맞는 모델이 최선</span>입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">선택 기준 5가지</div>
<ul>
  <li><strong>작업 유형</strong>: 텍스트 생성(Claude), 코드(Claude/DeepSeek), 이미지 생성(Stable Diffusion/Titan Image), 임베딩(Titan Embeddings, Cohere)</li>
  <li><strong>컨텍스트 윈도우</strong>: 긴 문서 처리 → 200K+ 컨텍스트 모델(Claude 3.5). 짧은 쿼리 → 작은 컨텍스트 모델로 비용 절감</li>
  <li><strong>비용</strong>: 입출력 토큰당 가격. Claude Haiku(빠름·저렴) vs Claude Opus(느림·고성능·고가). 동일 작업이면 저렴한 모델 우선 시도</li>
  <li><strong>응답 속도</strong>: 실시간 대화 → 속도 우선. 배치 처리 → 성능 우선</li>
  <li><strong>언어 지원</strong>: 한국어 성능은 모델마다 차이가 큼. Claude 계열이 한국어에서 일반적으로 우수</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">프론티어 모델 vs 오픈 웨이트 모델</div>
<p><strong>프론티어(독점) 모델</strong>: Claude, GPT — 최고 성능, API 사용료 필요, 소스 비공개. <strong>오픈 웨이트 모델</strong>: Llama, DeepSeek — 가중치 공개, 자체 서버 배포 가능, 비용 절감, 커스터마이징 자유. 보안이 중요하거나 특정 도메인 파인튜닝이 필요하다면 오픈 웨이트 모델을 검토하세요.</p>
</div>`},

  {t:'Interaction — Amazon Bedrock과의 상호작용', h:`
<div class="note-section"><div class="note-section-title">Bedrock 상호작용 3가지 방법</div>
<p>Amazon Bedrock과 상호작용하는 방법은 크게 세 가지입니다. 모두 내부적으로 <span class="note-kw">AWS REST API(HTTPS)</span>를 호출하며, 200개 이상의 파운데이션 모델에 동일한 방식으로 접근합니다.</p>
<ul>
  <li><strong>AWS 콘솔</strong>: 브라우저에서 UI로 대화형으로 테스트. 개발 시작 전 모델 비교·탐색에 유용. 코드 없이 바로 시작 가능.</li>
  <li><strong>AWS CLI</strong>: 터미널 명령으로 API 호출. 스크립팅, 자동화에 유용. 예: <code>aws bedrock-runtime invoke-model --model-id anthropic.claude-3-5-sonnet...</code></li>
  <li><strong>AWS SDK</strong>: Python(boto3), JavaScript, Java 등으로 애플리케이션에 통합. 실제 프로덕션 앱 개발에 사용.</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Converse API — 통합 대화 인터페이스</div>
<p><span class="note-kw">Converse API</span>는 서로 다른 FM 제공사의 모델을 동일한 코드 구조로 호출할 수 있게 해주는 통합 API입니다. Claude에서 Llama로 모델을 바꿔도 <code>modelId</code>만 변경하면 됩니다.</p>
<p>기본 패턴: <code>client.converse(modelId='...', messages=[{'role':'user','content':[{'text':'...'}]}])</code></p>
</div>
<div class="note-case"><div class="note-case-label">Kiro가 Bedrock을 호출하는 방식</div>
<p>Kiro 내부적으로 Claude 등 Bedrock 모델을 SDK로 호출합니다. 여러분이 Kiro 채팅창에 질문하는 순간, 배후에서 <strong>Converse API 호출 → Claude 응답 → 코드 생성</strong>이 일어나고 있습니다.</p>
</div>`},

  {t:'Access Key — 액세스 키와 보안', h:`
<div class="note-section"><div class="note-section-title">AWS 자격 증명 방식</div>
<p>AWS 리소스에 접근하는 방법은 두 가지입니다. <span class="note-kw">사람(사용자)</span>은 AWS 콘솔에 ID·비밀번호로 로그인하고, <span class="note-kw">애플리케이션·프로그램</span>은 액세스 키를 사용해 프로그래밍 방식으로 접근합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">액세스 키 구성</div>
<ul>
  <li><strong>Access Key ID</strong>: 공개 식별자 (예: AKIAIOSFODNN7EXAMPLE)</li>
  <li><strong>Secret Access Key</strong>: 비밀 서명 키 (절대 외부에 노출 금지)</li>
</ul>
<p>AWS SDK는 이 두 값으로 API 요청에 <strong>SigV4 서명</strong>을 추가해 요청을 인증합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">보안 모범 사례 — 절대 원칙</div>
<ul>
  <li><strong>루트 계정 키 사용 금지</strong>: 루트 계정은 모든 권한을 가지므로 절대 액세스 키를 만들지 않습니다</li>
  <li><strong>최소 권한 원칙</strong>: 필요한 권한만 IAM 정책으로 부여 (예: Bedrock만 호출하는 키는 Bedrock 권한만)</li>
  <li><strong>코드에 하드코딩 금지</strong>: 코드에 액세스 키를 직접 쓰면 GitHub 등에 노출될 위험. 환경 변수, AWS Secrets Manager, IAM Role 사용</li>
  <li><strong>IAM Role 권장</strong>: EC2·Lambda·ECS 등 AWS 서비스에서는 액세스 키 대신 IAM Role 사용 → 키 관리 불필요</li>
  <li><strong>주기적 순환</strong>: 어쩔 수 없이 키를 사용한다면 90일마다 교체</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">오늘 실습 — Kiro에서 Bedrock 사용</div>
<p>Kiro는 로그인된 AWS 자격 증명(AWS Builder ID 또는 IAM)을 자동으로 활용합니다. 별도로 액세스 키를 설정하지 않아도 Kiro를 통해 Bedrock을 사용할 수 있습니다. 하지만 오후에 직접 Bedrock SDK를 호출하는 코드를 작성한다면, <strong>환경 변수(<code>AWS_ACCESS_KEY_ID</code>, <code>AWS_SECRET_ACCESS_KEY</code>)</strong>로 자격 증명을 설정합니다.</p>
</div>`}
