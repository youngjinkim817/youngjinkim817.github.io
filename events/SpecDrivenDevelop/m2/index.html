<style>
:root{--bg:#ffffff;--bg-alt:#f0f9ff;--bg-soft:#e0f2fe;--primary:#1E40AF;--secondary:#7C3AED;--accent:#D97706;--t1:#1e3a5f;--t2:#3730a3;--t3:#6B7280;--border:#bfdbfe;--tag:#dbeafe;--sh:0 2px 8px rgba(30,64,175,.08);}
html.dark{--bg:#0a0a0f;--bg-alt:#0f172a;--bg-soft:#1e1b4b;--primary:#93C5FD;--secondary:#C4B5FD;--t1:#E0F2FE;--t2:#94A3B8;--t3:#64748B;--border:#1e3a5f;--tag:#1e1b4b;}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;font-size:17px;line-height:1.75;transition:background .2s,color .2s;}
header.top{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;background:#fff;border-bottom:2px solid var(--border);transition:background .25s;}
html.dark header.top{background:#0a0a0f;border-bottom-color:#1e3a5f;}
header.top .brand{font-weight:800;font-size:18px;color:var(--primary);}header.top .brand b{color:var(--secondary);}
.themebtn{margin-left:auto;width:34px;height:34px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);color:var(--t1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;}
.themebtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;}
.themebtn .moon{display:block;}.themebtn .sun{display:none;}
html.dark .themebtn .moon{display:none;}html.dark .themebtn .sun{display:block;}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px);}
aside{border-right:1px solid var(--border);padding:18px 12px;overflow-y:auto;position:sticky;top:64px;height:calc(100vh - 64px);background:var(--bg);display:flex;flex-direction:column;gap:4px;}
html.dark aside{border-right-color:#1e3a5f;}
.navday{margin-bottom:2px;}.navday-hd{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;transition:background .15s;}.navday-hd:hover{background:var(--tag);}
.navday-toggle{background:transparent;border:none;cursor:pointer;padding:2px;display:flex;align-items:center;flex-shrink:0;margin-top:1px;}
.navday-link{flex:1;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;}
.navday-arr{width:14px;height:14px;flex-shrink:0;margin-top:3px;color:var(--t3);transition:transform .22s ease;fill:none;stroke:currentColor;stroke-width:2.5;}
.navday.open>.navday-hd .navday-arr{transform:rotate(90deg);}
.navday-badge{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--secondary);}
.navday-name{font-size:12px;font-weight:600;line-height:1.35;color:var(--t1);}
.navday-body{padding:2px 0 6px 22px;border-left:2px solid var(--border);margin-left:13px;display:none;}
.navday.open>.navday-body{display:block;}
html.dark .navday-body{border-left-color:#1e3a5f;}
.nav-module{display:block;padding:7px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--t1);border-left:2px solid transparent;text-decoration:none;transition:background .15s;}
.nav-module:hover{background:var(--tag);color:var(--primary);}
.nav-module.active{background:var(--tag);border-left-color:var(--primary);color:var(--primary);font-weight:700;}
.prog-box{margin-top:16px;padding:10px 12px;background:var(--bg-alt);border-radius:10px;border:1px solid var(--border);}
.prog-box-label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.prog-counts{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:6px;}
.prog-bar{height:4px;background:#e0e0e8;border-radius:2px;overflow:hidden;}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:2px;transition:width .3s;}
.exit-classroom-btn{display:flex;align-items:center;gap:8px;margin:12px 0 8px;padding:9px 12px;border-radius:8px;background:rgba(239,68,68,.07);border:1.5px solid rgba(239,68,68,.25);color:#b91c1c;font-size:12px;font-weight:700;text-decoration:none;transition:all .2s;}
.exit-classroom-btn:hover{background:rgba(239,68,68,.15);border-color:#dc2626;}
main{padding:20px 24px 80px;width:100%;}
.svis{background:#0b1020;border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh);position:relative;overflow:hidden;aspect-ratio:16/9;width:100%;}
html.dark .svis{border-color:#1e3a5f;}
.svis-btns{position:absolute;top:10px;right:10px;z-index:50;display:flex;gap:6px;}

.svis-btn:hover{background:var(--primary);color:#fff;}
html.dark .svis-btn{background:rgba(10,10,15,.8);color:#E0F2FE;border-color:#1e3a5f;}
.npanel{background:var(--bg-alt);border:1px solid var(--border);border-radius:14px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh);margin-top:14px;font-size:15px;line-height:1.85;}
html.dark .npanel{background:#0f172a;border-color:#1e3a5f;}
.npanel-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
html.dark .npanel-header{border-bottom-color:#1e3a5f;}
.npanel-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--secondary);}
.npanel-slide-title{font-size:15px;font-weight:700;color:var(--primary);}
.note-section{margin-bottom:16px;}
.note-section-title{font-size:12px;font-weight:700;color:var(--secondary);border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;}
html.dark .note-section-title{border-bottom-color:#1e3a5f;}
.note-kw{font-weight:700;color:var(--secondary);}
.note-case{background:rgba(124,58,237,.07);border-left:3px solid var(--secondary);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;}
.note-case-label{font-size:11px;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.note-tip{background:rgba(30,64,175,.06);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;}
.note-tip-label{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.npanel ul{padding-left:20px;}.npanel li{margin-bottom:6px;}.npanel p{margin-bottom:8px;}
#fsOverlay{position:fixed;inset:0;z-index:900;background:#0b1020;flex-direction:column;}
.fs-topbar{height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;background:rgba(0,0,0,.5);flex-shrink:0;}
.fs-close{height:32px;padding:0 16px;border-radius:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.fs-close:hover{background:rgba(255,255,255,.25);}
#fsFrame{flex:1;width:100%;border:none;display:block;}
.fs-nav{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.5);}
.fs-nav button{height:34px;padding:0 20px;border-radius:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.fs-nav button:hover{background:rgba(255,255,255,.22);}
#fsCnt{font-size:14px;font-weight:700;color:rgba(255,255,255,.8);min-width:60px;text-align:center;}
.sticknav{position:fixed;bottom:0;left:0;right:0;z-index:300;background:var(--bg-alt);border-top:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 -4px 20px rgba(0,0,0,.08);}
html.dark .sticknav{background:#0a0a0f;border-top-color:#1e3a5f;}
.sticknav button{background:var(--bg-soft);border:1px solid var(--border);color:var(--t1);padding:7px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;font-family:inherit;}
.sticknav button:hover:not(:disabled){background:var(--primary);border-color:var(--primary);color:#fff;}
.sticknav button:disabled{opacity:.35;cursor:default;}
.sticknav-cnt{font-size:15px;color:var(--secondary);min-width:56px;text-align:center;font-weight:700;}
html.dark *{--border:#1e3a5f !important;}
html.dark body,html.dark aside,html.dark main,html.dark .sticknav{background-color:#0a0a0f;}
html.dark .navday-name,html.dark .nav-module{color:#E0F2FE !important;}
html.dark .navday-badge{color:#C4B5FD !important;}
html.dark .nav-module.active{background:rgba(147,197,253,.15) !important;color:#93C5FD !important;border-left-color:#93C5FD !important;}
html.dark .sticknav-cnt{color:#C4B5FD !important;}
</style>
</head>

<script>
var NOTES = [
  {t:'Module 2 · Kiro — AI 개발도구의 진화', h:`
<div class="note-section"><div class="note-section-title">AI 개발 도구의 진화 단계</div>
<p>코딩을 돕는 AI 도구는 지난 5년간 급격히 진화했습니다. <span class="note-kw">자동완성 → 어시스턴트 → 에이전트 → 자율성</span>의 순서로 AI의 역할이 점점 커지고 있습니다.</p>
<ul>
  <li><strong>자동완성 시대 (2021~)</strong>: GitHub Copilot 등장. 현재 타이핑 중인 코드 다음 줄을 예측·완성. 개발자가 모든 의사결정 주도.</li>
  <li><strong>어시스턴트 시대 (2022~)</strong>: ChatGPT·Claude 등 대화형 AI. 질문하면 코드 조각을 생성. 복사-붙여넣기 개발 방식.</li>
  <li><strong>에이전트 시대 (2024~)</strong>: Cursor, Kiro 등 Agentic IDE. 파일을 직접 읽고 수정하며, 명령을 실행하고, 오류를 스스로 수정. 개발자는 검토자 역할.</li>
  <li><strong>자율성 시대 (진행 중)</strong>: 사람의 개입 없이 전체 기능을 자율 구현하는 방향으로 진화 중.</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">자율성이 커질수록 중요해지는 것</div>
<p>AI가 더 많은 코드를 작성할수록 <strong>통제(Control)와 품질(Quality)</strong>이 중요해집니다. 에이전트가 잘못된 방향으로 달리기 시작하면 큰 피해가 발생합니다. Kiro의 Spec 모드와 Supervised 모드는 이 통제 문제를 해결하기 위한 장치입니다.</p>
</div>`},

  {t:'Coding Agents — 다양한 코딩 에이전트', h:`
<div class="note-section"><div class="note-section-title">주요 코딩 에이전트 생태계</div>
<p>2024~2025년을 기점으로 다양한 코딩 에이전트가 등장했습니다. IDE 통합형과 터미널(CLI)형으로 구분됩니다.</p>
<ul>
  <li><strong>Cursor</strong>: VS Code 포크 기반 IDE. Tab 자동완성, 채팅, Composer(멀티 파일 편집) 기능. 월 $20 Pro 플랜. 스타트업 개발자들에게 인기.</li>
  <li><strong>GitHub Copilot</strong>: GitHub 통합. VS Code·JetBrains 등 다양한 IDE 플러그인 지원. Microsoft·OpenAI 기술 활용.</li>
  <li><strong>AWS Kiro</strong>: 2025년 7월 AWS 출시. VS Code 오픈소스(Code OSS) 기반. Spec 기반 개발과 에이전트 기능이 핵심 차별점.</li>
  <li><strong>Claude Code (Anthropic)</strong>: 터미널 기반 CLI 에이전트. 자율적인 코드베이스 탐색·수정.</li>
  <li><strong>Devin (Cognition)</strong>: 완전 자율 소프트웨어 엔지니어 컨셉. Jira 티켓을 읽고 PR까지 자동 생성.</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">Kiro의 차별점</div>
<p>Kiro는 단순 코드 생성을 넘어 <strong>Spec 기반 개발 방법론</strong>을 IDE에 통합했다는 점이 독특합니다. 요구사항 작성 → AI 설계 → 태스크 실행의 구조화된 워크플로우를 제공하며, AWS 서비스(Bedrock, CodeWhisperer)와 긴밀하게 통합됩니다.</p>
</div>`},

  {t:'Kiro — AI 에이전트로 고품질 소프트웨어 출시', h:`
<div class="note-section"><div class="note-section-title">Kiro 소개</div>
<p><span class="note-kw">Kiro</span>는 AWS가 2025년 7월에 출시한 <span class="note-kw">AI 기반 Agentic IDE</span>입니다. <strong>VS Code 오픈소스(Code OSS)</strong> 기반으로 구축되어 친숙한 인터페이스를 제공하면서도, AI 에이전트 기능으로 개발 전 과정을 자동화합니다.</p>
<p><em>"프로토타입에서 프로덕션까지"</em>가 Kiro의 슬로건입니다. 단순히 코드를 빠르게 만드는 것이 아니라, <strong>실제 운영 가능한 품질의 소프트웨어</strong>를 만드는 것이 목표입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">Kiro의 핵심 기능</div>
<ul>
  <li><strong>Vibe Mode</strong>: 자유 대화형 코딩. "로그인 페이지 만들어줘" 같은 자연어 요청으로 즉시 코드 생성.</li>
  <li><strong>Spec Mode</strong>: 요구사항→설계→태스크 3단계 구조화 개발. 복잡한 기능을 체계적으로 구현.</li>
  <li><strong>Steering</strong>: 프로젝트 규칙·컨벤션을 .md 파일로 정의. Kiro가 항상 참조.</li>
  <li><strong>MCP (Model Context Protocol)</strong>: Figma, GitHub, Jira, Slack 등 외부 도구 연동.</li>
  <li><strong>Skills</strong>: 재사용 가능한 작업 절차 패키지.</li>
  <li><strong>Agent Hooks</strong>: 파일 저장, 커밋 등 이벤트 기반 자동화.</li>
  <li><strong>Powers</strong>: 기능 번들 (AWS 개발 도구, Strands SDK 등).</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">왜 Kiro인가 — AWS 생태계 통합</div>
<p>Kiro는 Amazon Bedrock(Claude, Titan), AWS CodeWhisperer, Amazon Q와 긴밀히 통합됩니다. AWS 기반 서비스를 개발할 때 인프라 코드, CloudFormation 템플릿, Lambda 함수를 맥락을 이해하며 생성합니다.</p>
</div>`},

  {t:'IDE &amp; CLI — 두 얼굴의 Kiro', h:`
<div class="note-section"><div class="note-section-title">Kiro IDE</div>
<p><span class="note-kw">Kiro IDE</span>는 VS Code 기반의 그래픽 에디터입니다. 코드 편집, 파일 탐색, AI 채팅, 터미널이 하나의 화면에 통합되어 있습니다.</p>
<ul>
  <li>플랫폼: macOS, Windows, Linux 지원</li>
  <li>설치: kiro.dev에서 설치 파일 다운로드</li>
  <li>VS Code 확장(Extension) 호환: 기존 VS Code 플러그인 대부분 사용 가능</li>
  <li>적합한 상황: 일반 개발 작업, GUI 필요 시, 초보자</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Kiro CLI</div>
<p><span class="note-kw">Kiro CLI</span>는 터미널에서 실행하는 명령줄 코딩 에이전트입니다. GUI 없이 터미널 명령으로 AI와 대화하며 코드를 생성·수정합니다.</p>
<ul>
  <li>설치: <code>npm install -g @aws/kiro-cli</code> 또는 Homebrew</li>
  <li>사용: <code>kiro "React 앱 만들어줘"</code></li>
  <li>적합한 상황: CI/CD 파이프라인, 서버 환경, 스크립팅, 배치 작업</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">동일한 .kiro 설정 공유</div>
<p>IDE와 CLI 모두 동일한 <strong><code>.kiro/</code> 디렉토리</strong>를 읽습니다. Steering 규칙, MCP 설정, Skills가 IDE와 CLI에서 동일하게 적용됩니다. 팀원 A가 IDE로, 팀원 B가 CLI로 작업해도 같은 규칙이 적용됩니다.</p>
</div>`},

  {t:'Sign in — Kiro 로그인', h:`
<div class="note-section"><div class="note-section-title">Kiro 로그인 방법</div>
<p>Kiro는 4가지 방법으로 로그인할 수 있습니다.</p>
<ul>
  <li><strong>Google 계정</strong>: 개인 Google 계정으로 간편 로그인</li>
  <li><strong>GitHub 계정</strong>: GitHub 계정 연동</li>
  <li><strong>AWS Builder ID</strong>: AWS 개인 계정. re:Post, AWS Skill Builder 등 AWS 개인 서비스에 사용하는 무료 ID.</li>
  <li><strong>IAM Identity Center(SSO)</strong>: 기업 조직의 SSO. 회사 AWS 계정으로 로그인. 팀 협업 및 권한 관리에 적합.</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">로그인 후 AI 기능 활성화</div>
<p>로그인이 완료되면 Kiro의 AI 기능(Vibe, Spec, Steering 등)이 활성화됩니다. 내부적으로 Amazon Bedrock의 Claude 모델을 호출해 코드를 생성합니다. 무료 티어와 유료 플랜에 따라 사용 한도가 다릅니다.</p>
</div>
<div class="note-case"><div class="note-case-label">오늘 실습</div>
<p>이미 Kiro를 설치하고 로그인하셨다면 준비 완료입니다. 로그인이 안 되셨다면 강사에게 문의하거나 kiro.dev에서 Google/GitHub으로 빠르게 로그인하세요. <strong>AWS Builder ID가 없어도</strong> Google이나 GitHub 계정으로 바로 시작할 수 있습니다.</p>
</div>`},

  {t:'.kiro 디렉토리 — 설정의 두 스코프', h:`
<div class="note-section"><div class="note-section-title">.kiro 디렉토리의 역할</div>
<p><span class="note-kw"><code>.kiro/</code></span> 디렉토리는 Kiro의 모든 설정이 저장되는 핵심 폴더입니다. Git으로 버전 관리할 수 있어 팀 전체가 동일한 설정을 공유합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">두 가지 스코프</div>
<ul>
  <li><strong>Global(전역) 설정: <code>~/.kiro/</code></strong> — 홈 디렉토리에 위치. 모든 프로젝트에 공통 적용. 개인 선호도, 기본 코딩 스타일. 예) "나는 항상 TypeScript를 선호한다"</li>
  <li><strong>Workspace(워크스페이스) 설정: <code>./.kiro/</code></strong> — 현재 프로젝트 루트에 위치. 해당 프로젝트에만 적용. 팀 규칙, 프로젝트별 기술 스택. 예) "이 프로젝트는 React + Tailwind 사용"</li>
</ul>
<p><strong>우선순위</strong>: Workspace 설정이 Global 설정보다 우선합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">.kiro/ 폴더 구조</div>
<ul>
  <li><code>.kiro/steering/</code>: 규칙 파일 (.md) — "항상 ESLint 규칙 준수", "API 응답 형식 통일"</li>
  <li><code>.kiro/specs/</code>: Spec 파일 — 요구사항, 설계, 태스크 체크리스트</li>
  <li><code>.kiro/settings/mcp.json</code>: MCP 서버 설정</li>
  <li><code>.kiro/hooks/</code>: 자동화 훅 파일</li>
  <li><code>.kiro/agents/</code>: 커스텀 에이전트 정의</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">팀 협업 팁</div>
<p>.kiro/steering/ 폴더를 Git에 커밋하면 팀원 모두가 동일한 규칙으로 Kiro를 사용합니다. 새 팀원이 합류하면 git clone 하는 순간 동일한 AI 코딩 환경이 설정됩니다.</p>
</div>`},

  {t:'Interface — Kiro 화면 구성', h:`
<div class="note-section"><div class="note-section-title">Kiro IDE 화면 구성 요소</div>
<p>Kiro의 인터페이스는 VS Code와 유사하지만, AI 기능을 위한 전용 패널이 추가되어 있습니다.</p>
<ul>
  <li><strong>파일 탐색기 (좌측)</strong>: 프로젝트 파일 트리. .kiro/ 폴더도 여기서 관리.</li>
  <li><strong>코드 에디터 (중앙)</strong>: 코드 편집 영역. AI가 생성·수정한 내용이 diff(변경 사항) 형태로 표시됨. accept/reject 버튼으로 변경 승인.</li>
  <li><strong>채팅 패널 (우측)</strong>: Vibe/Spec 모드 입력창. AI와 대화하는 공간. @파일명으로 특정 파일 참조, #으로 Steering 파일 참조.</li>
  <li><strong>터미널 패널 (하단)</strong>: 명령 실행 결과. AI가 실행하는 npm install, git 명령 등이 여기 표시됨.</li>
  <li><strong>Kiro 기능 패널 (좌측 아이콘)</strong>: Steering, MCP, Hooks, Powers, Spec 관리 전용 뷰.</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">생산성 팁 — 채팅에서 파일 참조</div>
<p>채팅창에서 <strong><code>#파일명</code></strong>을 입력하면 해당 파일 내용을 컨텍스트로 포함합니다. "이 #package.json 파일을 보고 프로젝트 의존성을 설명해줘"처럼 사용합니다. 여러 파일을 동시에 참조할 수 있습니다.</p>
</div>`},

  {t:'Execution Mode — Autopilot vs Supervised', h:`
<div class="note-section"><div class="note-section-title">두 가지 실행 모드</div>
<p>Kiro의 실행 모드는 채팅 패널의 스위치로 전환합니다. AI가 파일을 수정할 때 사람의 승인을 요구하는지 여부가 핵심 차이입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">Autopilot (자동 모드)</div>
<p><span class="note-kw">Autopilot</span>은 기본 모드입니다. Kiro가 승인 없이 자율적으로 파일을 만들고, 수정하고, 명령을 실행합니다.</p>
<ul>
  <li>빠른 개발 속도 — 중간에 멈추지 않음</li>
  <li>변경 완료 후 diff를 확인하고 되돌릴(revert) 수 있음</li>
  <li>적합한 상황: 새 프로젝트, 빠른 프로토타이핑, 잘 아는 코드베이스</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Supervised (감독 모드)</div>
<p><span class="note-kw">Supervised</span>는 모든 변경을 단계별로 개발자가 승인합니다. 각 파일 변경 hunk를 accept 또는 reject 할 수 있습니다.</p>
<ul>
  <li>세밀한 제어 — 원치 않는 변경 즉시 거부 가능</li>
  <li>속도는 느리지만 위험 최소화</li>
  <li>적합한 상황: 프로덕션 코드베이스, 중요 보안 로직, 팀 코드 리뷰 과정</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">오늘 실습 추천</div>
<p>오늘은 새 프로젝트를 빠르게 만드는 것이 목표이므로 <strong>Autopilot 모드</strong>를 사용합니다. Kiro가 파일을 만드는 동안 지켜보다가, 완료 후 생성된 파일들을 검토하는 방식으로 진행합니다.</p>
</div>`},

  {t:'Vibe Mode — 대화형 개발', h:`
<div class="note-section"><div class="note-section-title">Vibe Mode란</div>
<p><span class="note-kw">Vibe 모드</span>는 자유롭게 대화하듯 코드를 만드는 Kiro의 기본 개발 방식입니다. 명확한 계획 없이 아이디어를 바로 코드로 탐색합니다.</p>
<p>예시: "간단한 HTML 스도쿠 웹 애플리케이션을 만들어서 파일로 저장해줘"</p>
</div>
<div class="note-section"><div class="note-section-title">Vibe 모드 동작 방식</div>
<ul>
  <li><strong>자연어 요청 입력</strong>: 채팅창에 원하는 것을 한국어 또는 영어로 입력</li>
  <li><strong>Kiro의 계획 제시</strong>: 어떻게 만들지 계획을 먼저 설명</li>
  <li><strong>자율 실행</strong>: 파일 탐색 → 코드 생성 → 파일 저장 → 의존성 설치 → 실행까지 자동</li>
  <li><strong>결과 보고</strong>: 완료 후 무엇을 만들었는지 요약</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Vibe 모드 효과적 사용법</div>
<ul>
  <li><strong>구체적인 요청</strong>: "버튼 추가해줘" 보다 "파란색 Submit 버튼을 폼 하단에 추가해줘" 가 더 정확</li>
  <li><strong>맥락 제공</strong>: "이 프로젝트는 React + TypeScript를 사용해"처럼 배경 정보 포함</li>
  <li><strong>반복 개선</strong>: 완벽하지 않아도 "이 부분을 수정해줘"로 반복 개선 가능</li>
  <li><strong>파일 참조</strong>: #파일명으로 특정 파일을 컨텍스트로 제공</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">Vibe의 한계 — Spec이 필요한 순간</div>
<p>Vibe는 대화 흐름대로 발전하므로, 큰 기능을 여러 번 나눠 만들다 보면 코드가 일관성을 잃을 수 있습니다. 또한 "왜 이렇게 설계했는가"의 추적이 어렵습니다. 이때 Spec이 필요합니다.</p>
</div>`},

  {t:'Spec-Driven Development — 프롬프트를 스펙으로', h:`
<div class="note-section"><div class="note-section-title">스펙 기반 개발이란</div>
<p><span class="note-kw">Spec-Driven Development(SDD)</span>는 구현 전에 <span class="note-kw">요구사항 → 설계 → 태스크</span>를 구조화된 문서로 작성하고, AI가 이를 기반으로 코드를 생성하는 방법론입니다.</p>
<p>모호한 자연어 프롬프트를 <strong>명확하고 추적 가능한 명세서</strong>로 변환하는 과정이 핵심입니다. Kiro는 이 과정을 IDE에서 지원합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">SDD가 필요한 이유</div>
<ul>
  <li><strong>복잡한 기능</strong>: 여러 파일과 컴포넌트에 걸친 기능은 즉흥적 Vibe로는 일관성 유지 어려움</li>
  <li><strong>팀 협업</strong>: Spec 문서로 AI가 무엇을 만들지 팀이 사전에 합의 가능</li>
  <li><strong>요구사항 추적</strong>: "이 코드가 왜 이렇게 생겼는가"를 Spec으로 추적 가능</li>
  <li><strong>변경 관리</strong>: 요구사항이 바뀌면 Spec을 업데이트하고 재생성</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">Kiro에서 Spec 시작하기</div>
<p>Kiro 채팅창에서 <code>/spec</code> 명령을 입력하거나, Kiro 기능 패널의 Specs 탭에서 새 Spec을 생성합니다. "사용자 인증 기능을 추가하고 싶어"라고 입력하면 Kiro가 Requirements 초안을 작성합니다.</p>
</div>`},

  {t:'3-Phase 워크플로우 — 단계마다 검토하고 병렬 실행', h:`
<div class="note-section"><div class="note-section-title">3단계 Spec 워크플로우</div>
<p>Kiro의 Spec은 세 단계로 진행되며, 각 단계 사이에 <span class="note-kw">사람의 검토(Human-in-the-Loop, HITL)</span> 게이트가 있습니다. 다음 단계로 넘어가기 전 반드시 확인·수정할 수 있습니다.</p>
</div>
<div class="note-section"><div class="note-section-title">Phase 1: Requirements (요구사항)</div>
<p>"무엇을 만들 것인가"를 정의합니다.</p>
<ul>
  <li>사용자 스토리(User Story): "사용자로서 나는 ~을 할 수 있다"</li>
  <li>기능 요구사항: 시스템이 무엇을 해야 하는가</li>
  <li>비기능 요구사항: 성능, 보안, 확장성 등</li>
  <li>Kiro가 초안 작성 → 사람이 검토·수정 → 승인</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Phase 2: Design (설계)</div>
<p>"어떻게 만들 것인가"를 정의합니다.</p>
<ul>
  <li>아키텍처 개요, 컴포넌트 다이어그램</li>
  <li>데이터 모델(스키마), API 엔드포인트 설계</li>
  <li>기술 선택(프레임워크, 라이브러리)</li>
  <li>파일 구조</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Phase 3: Tasks (태스크)</div>
<p>"어떤 순서로 만들 것인가"를 정의합니다.</p>
<ul>
  <li>구현을 체크리스트 형태의 태스크로 분해</li>
  <li>태스크 간 의존성을 고려한 순서 결정</li>
  <li>독립적 태스크는 Kiro가 <strong>병렬(parallel)</strong>로 실행 가능</li>
  <li>각 태스크 완료 시 체크박스 자동 업데이트</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">병렬 실행의 위력</div>
<p>서로 의존성 없는 태스크 — 예를 들어 "프론트엔드 컴포넌트 생성"과 "API 엔드포인트 구현"을 동시에 실행합니다. 순차 실행 대비 <strong>2~3배 빠른 구현</strong>이 가능합니다.</p>
</div>`},

  {t:'Vibe vs Spec — 빠른 탐색 vs 제대로 만들기', h:`
<div class="note-section"><div class="note-section-title">상황별 선택 가이드</div>
<p>Vibe와 Spec 중 무엇을 선택할지는 <span class="note-kw">작업의 복잡도와 목적</span>에 따라 결정합니다. 둘 중 하나만 고집할 필요 없이, 상황에 맞게 조합하는 것이 실전 방식입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">비교표</div>
<ul>
  <li><strong>개발 속도</strong>: Vibe 빠름(바로 시작) vs Spec 느림(계획 수립 시간)</li>
  <li><strong>코드 일관성</strong>: Vibe 낮음 vs Spec 높음(명세 기반 생성)</li>
  <li><strong>요구사항 추적</strong>: Vibe 불가 vs Spec 가능(문서화)</li>
  <li><strong>대형 프로젝트</strong>: Vibe 부적합 vs Spec 적합</li>
  <li><strong>팀 협업</strong>: Vibe 어려움 vs Spec 용이(공유 명세)</li>
  <li><strong>탐색·실험</strong>: Vibe 최적 vs Spec 과도함</li>
  <li><strong>디버깅</strong>: Vibe 즉시 vs Spec 태스크 단위</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">실전 조합 전략</div>
<p><strong>Step 1 (Vibe)</strong>: "어떻게 될지" 빠르게 탐색. 30분 내로 프로토타입 완성.<br>
<strong>Step 2 (Spec)</strong>: 프로토타입이 마음에 들면 Spec을 작성해 제대로 구현.<br>
<strong>Step 3 (Vibe)</strong>: Spec 범위 밖의 작은 수정은 다시 Vibe로.<br>
오늘 오후 실습에서도 이 순서를 따릅니다.</p>
</div>`},

  {t:'핵심 구성요소 — Kiro를 움직이는 다섯 가지 장치', h:`
<div class="note-section"><div class="note-section-title">Kiro의 5가지 핵심 구성요소</div>
<p>Kiro는 단순한 코드 생성기를 넘어 5가지 핵심 장치로 개발 전반을 제어합니다. 이 장치들을 조합하면 팀의 개발 표준을 AI에 내재화할 수 있습니다.</p>
</div>
<div class="note-section"><div class="note-section-title">5가지 장치</div>
<ul>
  <li><strong>Steering (프로젝트 규칙)</strong>: .kiro/steering/*.md 파일로 팀 규칙 정의. "TypeScript만 사용", "snake_case 금지" 등. Kiro가 코드 생성 시 자동 참조.</li>
  <li><strong>MCP (외부 도구 연동)</strong>: Model Context Protocol. Figma 디자인, GitHub Issues, Jira 티켓, Slack 메시지 등 외부 시스템을 Kiro의 도구로 연동.</li>
  <li><strong>Skills (작업 절차 패키지)</strong>: 자주 사용하는 복잡한 작업 절차를 패키지화. "Django 프로젝트 초기화 Skills", "AWS Lambda 배포 Skills" 등.</li>
  <li><strong>Agent Hooks (이벤트 자동화)</strong>: 특정 이벤트(파일 저장, git commit, 테스트 실패 등)에 자동으로 Kiro 작업 실행.</li>
  <li><strong>Powers (기능 번들)</strong>: 여러 구성요소를 묶은 번들 패키지. AWS 개발용 Power, Strands SDK Power 등.</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">오늘 실습 집중 영역</div>
<p>이번 과정에서는 <strong>Steering</strong>을 중점적으로 다룹니다. Steering은 가장 즉각적인 효과를 보여주며, 오늘 만드는 프로젝트에 바로 적용할 수 있습니다.</p>
</div>`},

  {t:'Steering — 규칙 설정', h:`
<div class="note-section"><div class="note-section-title">Steering이란</div>
<p><span class="note-kw">Steering</span>은 Kiro에게 프로젝트의 규칙, 컨벤션, 배경 지식을 알려주는 마크다운 문서입니다. <code>.kiro/steering/</code> 폴더에 위치하며, Kiro는 코드를 생성할 때 이 파일들을 자동으로 읽고 반영합니다.</p>
<p><em>"규칙이 없으면 그때그때 다르게, 규칙을 한 장 적어 두면 항상 같은 기준으로 동작합니다."</em></p>
</div>
<div class="note-section"><div class="note-section-title">Steering 없을 때 vs 있을 때</div>
<ul>
  <li><strong>Steering 없음</strong>: 같은 질문을 해도 매번 다른 스타일의 코드 생성. React 컴포넌트를 함수형으로 만들었다가 클래스형으로 만들었다가 중구난방.</li>
  <li><strong>Steering 있음</strong>: "함수형 컴포넌트만 사용, TypeScript 필수, CSS Module 사용"이라고 적어두면 항상 동일한 스타일로 생성.</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">실무에서 Steering 활용</div>
<p>신규 팀원이 합류하면 코딩 스타일 가이드를 읽히는 데 시간이 걸립니다. Steering에 팀 규칙을 정리해두면 Kiro가 자동으로 규칙을 적용해, 신규 팀원도 <strong>첫날부터 팀 표준에 맞는 코드</strong>를 작성할 수 있습니다.</p>
</div>`},

  {t:'Steering — Kiro가 항상 알고 있어야 할 내용', h:`
<div class="note-section"><div class="note-section-title">Steering에 담을 내용</div>
<p>Steering 파일은 <span class="note-kw">프로젝트를 열 때마다 Kiro가 먼저 읽는 메모</span>입니다. 매번 채팅에서 반복하기 번거로운 배경 지식과 규칙을 담습니다.</p>
</div>
<div class="note-section"><div class="note-section-title">좋은 Steering 내용 예시</div>
<ul>
  <li><strong>기술 스택</strong>: "이 프로젝트는 Next.js 14(App Router), TypeScript, Tailwind CSS, Prisma(PostgreSQL)를 사용한다"</li>
  <li><strong>코딩 컨벤션</strong>: "컴포넌트는 PascalCase, 유틸 함수는 camelCase, 상수는 UPPER_SNAKE_CASE"</li>
  <li><strong>아키텍처 원칙</strong>: "비즈니스 로직은 /lib에, API 핸들러는 /app/api에, 컴포넌트는 /components에"</li>
  <li><strong>팀 용어</strong>: "User는 우리 서비스 가입자, Member는 팀 멤버를 의미한다"</li>
  <li><strong>금지 사항</strong>: "any 타입 사용 금지, console.log는 commit 전 제거"</li>
  <li><strong>API 규칙</strong>: "모든 API 응답은 {data, error, status} 형태로 반환"</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">Steering 작성 팁</div>
<p><strong>짧고 명확하게</strong> 작성합니다. 너무 길고 복잡한 Steering은 오히려 효과가 감소합니다. 핵심 규칙 10~20개를 간결한 문장으로 작성하는 것이 가장 효과적입니다. 마크다운 헤더로 카테고리를 구분하면 관리가 쉽습니다.</p>
</div>`},

  {t:'Steering 적용 — .kiro/steering/ 폴더 사용', h:`
<div class="note-section"><div class="note-section-title">Steering 파일 생성 방법</div>
<p><code>.kiro/steering/</code> 폴더에 <code>.md</code> 파일을 만들면 규칙이 자동 적용됩니다. 파일 이름은 자유롭게 설정합니다.</p>
<ul>
  <li><code>project.md</code>: 전체 프로젝트 규칙</li>
  <li><code>frontend.md</code>: 프론트엔드 전용 규칙</li>
  <li><code>api.md</code>: API 설계 규칙</li>
  <li><code>security.md</code>: 보안 관련 규칙</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Steering 파일 예시</div>
<p>파일: <code>.kiro/steering/project.md</code></p>
<ul>
  <li>프론트매터(front-matter): inclusion 모드 설정 가능 (없으면 기본값 always)</li>
  <li>내용: 기술 스택, 코딩 규칙, 디렉토리 구조 등 마크다운으로 작성</li>
  <li>다른 파일 참조: <code>#[[file:openapi.yaml]]</code>로 스펙 파일 포함 가능</li>
</ul>
</div>
<div class="note-tip"><div class="note-tip-label">오늘 실습 적용</div>
<p>오후 개인 프로젝트 시작 전, <code>.kiro/steering/project.md</code>에 프로젝트 규칙을 작성해보세요. "이 프로젝트는 HTML+CSS+JavaScript 바닐라로 만든다. 외부 라이브러리 사용 금지. 한국어 인터페이스." 이 정도만 적어도 Kiro가 일관성 있게 코드를 생성합니다.</p>
</div>`},

  {t:'inclusion — Steering 적용 시점', h:`
<div class="note-section"><div class="note-section-title">inclusion이란</div>
<p>Steering 파일 맨 위의 <span class="note-kw">프론트매터(front-matter)</span>에 <code>inclusion</code> 키를 설정해 해당 규칙이 언제 적용될지 제어합니다. 모든 Steering을 항상 적용하면 컨텍스트가 과부하될 수 있으므로, 적절히 분리하는 것이 중요합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">4가지 inclusion 모드</div>
<ul>
  <li><strong>always (기본값)</strong>: 모든 AI 요청에 항상 포함. 핵심 규칙에 적합. 예) 기본 코딩 스타일.
    <br><em>프론트매터 없이 파일 생성 시 기본값.</em></li>
  <li><strong>fileMatch</strong>: 특정 파일 패턴과 매칭 시 포함. 예) <code>*.tsx</code> 파일 편집 시 React 규칙 자동 적용.
    <br><code>fileMatchPattern: "**/*.tsx"</code></li>
  <li><strong>manual</strong>: 채팅에서 <code>#Steering파일명</code>으로 직접 참조할 때만 포함. 자주 쓰지 않는 특수 규칙에 적합.</li>
  <li><strong>auto</strong>: 요청 내용이 파일의 name/description과 매칭 시 자동 활성화. Kiro가 "이 요청에 관련 규칙이 있다"고 판단 시 적용.</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">실전 inclusion 전략</div>
<p>핵심 규칙(<code>always</code>) → 언어별 규칙(<code>fileMatch</code>) → 특수 상황 규칙(<code>manual</code>) 순서로 계층화합니다. 예: 공통 스타일은 always, TypeScript 규칙은 *.ts 파일 매칭, 보안 체크리스트는 manual로 필요할 때만 불러옵니다.</p>
</div>`},

  {t:'Steering — Kiro에게 Steering 생성 요청', h:`
<div class="note-section"><div class="note-section-title">Kiro가 Steering을 자동 생성</div>
<p>Steering 파일을 직접 작성하기 어렵다면, <span class="note-kw">Kiro에게 Steering 파일 생성을 요청</span>할 수 있습니다. 원하는 규칙을 설명하면 Kiro가 <code>.kiro/steering/</code>에 적절한 마크다운 파일을 만들어 줍니다.</p>
</div>
<div class="note-section"><div class="note-section-title">Kiro에게 Steering 요청하는 방법</div>
<ul>
  <li>"이 프로젝트의 코딩 스타일 규칙을 Steering 파일로 만들어줘"</li>
  <li>"이 코드베이스를 분석해서 사용 중인 패턴을 Steering으로 정리해줘"</li>
  <li>"React + TypeScript 프로젝트용 기본 Steering 파일 만들어줘"</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">기존 코드베이스에서 Steering 추출</div>
<p>이미 작성된 코드베이스가 있다면, Kiro에게 "이 프로젝트의 코드를 분석해서 사용 중인 패턴과 규칙을 Steering 파일로 정리해줘"라고 요청합니다. Kiro가 코드를 읽고 암묵적인 규칙들을 명시적 Steering으로 문서화합니다. <strong>레거시 코드베이스의 "암묵지"를 AI가 읽을 수 있는 "형식지"로</strong> 변환합니다.</p>
</div>
<div class="note-tip"><div class="note-tip-label">오늘 실습 — Steering 첫 시도</div>
<p>오후 개인 프로젝트 시작 시, Kiro에게 <strong>"이 프로젝트에 맞는 Steering 파일을 만들어줘. 프로젝트는 [내 아이디어 설명]이고, 바닐라 JS로 만들 예정이야"</strong>라고 요청해보세요. Kiro가 맞춤형 Steering 초안을 만들어 줍니다.</p>
</div>`},

  {t:'효과와 한계 — Steering의 효과와 한계', h:`
<div class="note-section"><div class="note-section-title">Steering의 효과</div>
<p>Steering을 잘 작성하고 관리하면 다음과 같은 효과를 얻습니다.</p>
<ul>
  <li><strong>일관성</strong>: 같은 프로젝트의 코드가 파일마다, 대화마다 다른 스타일로 생성되는 문제 해소</li>
  <li><strong>반복 설명 감소</strong>: "우리 프로젝트는 TypeScript야"를 매번 설명하지 않아도 됨</li>
  <li><strong>팀 표준 자동 적용</strong>: 신규 팀원도 Steering 덕분에 즉시 팀 스타일로 코딩</li>
  <li><strong>도메인 지식 내재화</strong>: "우리 회사에서 User는 외부 고객, Member는 내부 직원"처럼 비즈니스 언어를 AI에게 학습시킬 수 있음</li>
  <li><strong>버전 관리</strong>: Git으로 규칙 변경 이력 관리</li>
</ul>
</div>
<div class="note-section"><div class="note-section-title">Steering의 한계</div>
<ul>
  <li><strong>완벽하지 않음</strong>: Steering을 설정해도 AI가 항상 정확히 따르지 않을 수 있음. 특히 복잡한 규칙.</li>
  <li><strong>컨텍스트 비용</strong>: Steering이 너무 많으면 컨텍스트 윈도우를 소비해 오히려 성능 저하. 필수 규칙만 always로.</li>
  <li><strong>최종 확인은 사람</strong>: AI가 생성한 코드가 Steering을 따랐는지 반드시 사람이 검토. "AI가 만들었으니 괜찮겠지"는 금물.</li>
  <li><strong>규칙 충돌</strong>: 여러 Steering 파일의 규칙이 충돌하면 AI가 혼란스러워할 수 있음</li>
</ul>
</div>
<div class="note-case"><div class="note-case-label">핵심 원칙 — AI를 파트너로</div>
<p>Kiro와 Steering은 <strong>개발자의 생산성을 높이는 도구</strong>입니다. AI가 만든 코드는 반드시 이해하고 검토해야 합니다. "AI가 다 해줬으니 나는 몰라도 된다"가 아니라, "AI가 초안을 잡아줬으니 내가 빠르게 검토하고 개선한다"는 태도가 올바른 AI 개발 방식입니다.</p>
</div>`},
  {t:'MCP 연결하기', h:`
<div class="note-section">
  <div class="note-section-title">MCP란</div>
  <p><span class="note-kw">MCP(Model Context Protocol)</span>는 AI 에이전트와 외부 도구·데이터 소스를 표준화된 방식으로 연결하는 프로토콜입니다. Anthropic이 주도하여 공개한 개방형 표준으로, MCP를 지원하는 AI 클라이언트라면 모두 같은 방식으로 MCP 서버의 도구를 사용할 수 있습니다.</p>
</div>
<div class="note-section">
  <div class="note-section-title">MCP가 약속하는 세 가지</div>
  <ul>
    <li><span class="note-kw">표준 서버-클라이언트 구조</span>: 에이전트(클라이언트)와 도구(서버)를 정해진 규격으로 연결합니다. 도구마다 다른 연동 코드를 작성할 필요가 없습니다.</li>
    <li><span class="note-kw">리소스·도구 추상화</span>: 도구가 무엇을 하는지 표준 형식(Tools, Resources, Prompts)으로 AI에 노출합니다. 에이전트는 이 명세를 읽고 스스로 도구를 선택합니다.</li>
    <li><span class="note-kw">플랫폼 독립</span>: 한 번 만든 MCP 서버는 Kiro, Claude Desktop, Cursor 등 MCP를 지원하는 모든 AI 환경에서 재사용됩니다.</li>
  </ul>
</div>
<div class="note-section">
  <div class="note-section-title">MCP 동작 흐름</div>
  <p>에이전트가 도구가 필요할 때 MCP를 통해 요청하면, MCP가 하나의 통합 창구 역할을 하여 연결된 도구 서버(AWS 설명서 검색, Cost Explorer, 다이어그램 생성기 등)로 요청을 라우팅합니다. 에이전트는 어떤 서버인지 몰라도 됩니다.</p>
</div>
<div class="note-case">
  <div class="note-case-label">사용 사례: AWS 지식 MCP 서버</div>
  <p>AWS Knowledge MCP 서버(<code>https://knowledge-mcp.global.api.aws</code>)를 연결하면 Kiro가 AWS 공식 문서와 모범 사례를 직접 검색하면서 코드를 작성합니다. <strong>AWS 서비스를 활용하는 코드를 작성할 때 API 문서를 직접 찾아보지 않아도</strong> AI가 최신 AWS 정보를 참고합니다.</p>
</div>`}
{t:'코딩 에이전트와 MCP', h:`
<div class="note-section">
  <div class="note-section-title">에이전트가 MCP를 활용하는 방식</div>
  <p>MCP 서버를 연결해 두면 <span class="note-kw">코딩 에이전트(Coding Agent)</span>가 서버의 도구 명세를 자동으로 읽고, 현재 작업에 필요한 도구를 <strong>스스로 골라 호출</strong>합니다. 개발자가 직접 API 문서를 찾거나 연동 코드를 작성할 필요가 없습니다. 비유하자면, MCP 서버를 등록하는 것은 <strong>콘센트에 꽂듯</strong> 에이전트에 새 도구를 추가하는 것과 같습니다.</p>
</div>
<div class="note-section">
  <div class="note-section-title">MCP 호스트 구조</div>
  <ul>
    <li><span class="note-kw">코딩 에이전트</span>: 도구 명세를 읽고 어떤 도구를 언제 사용할지 스스로 판단합니다.</li>
    <li><span class="note-kw">MCP 클라이언트</span>: 에이전트 안에서 MCP 서버와의 실제 통신을 담당합니다.</li>
    <li><span class="note-kw">MCP 서버들</span>: DB 서버(사내 데이터베이스), API 서버(업무 API), 파일 서버(문서·파일) 등 다양한 도구를 제공합니다.</li>
  </ul>
</div>
<div class="note-section">
  <div class="note-section-title">실제 요청 처리 흐름</div>
  <p>사용자가 "이커머스 웹 애플리케이션을 AWS에 배포하는 방법을 공식 문서를 참고해서 알려줘"라고 요청하면, 코딩 에이전트가 연결된 MCP 서버 목록을 확인하고 필요한 도구(DB 조회, API 호출, 문서 참조)를 순서대로 선택하여 전체 코드를 작성합니다.</p>
</div>
<div class="note-case">
  <div class="note-case-label">사용 사례: 자동화된 에이전트 코드 생성</div>
  <p>AWS Knowledge MCP와 사내 DB MCP를 모두 연결해 두면, Kiro 에이전트가 AWS 문서를 참고하면서 동시에 실제 사내 데이터 스키마를 확인하여 <strong>정확한 코드를 처음부터 작성</strong>합니다. 개발자는 방향만 제시하면 됩니다.</p>
</div>`}
{t:'MCP 서버 연결 방법', h:`
<div class="note-section">
  <div class="note-section-title">두 가지 연결 방식</div>
  <p>MCP 서버는 실행 위치에 따라 두 가지 방식으로 연결합니다. <span class="note-kw">원격 방식(Streamable HTTP)</span>은 이미 배포된 서버에 URL로 연결하고, <span class="note-kw">로컬 방식(stdio)</span>은 내 PC에서 Kiro가 직접 서버를 실행하여 연결합니다. 두 방식 모두 <code>.kiro/settings/mcp.json</code>에 설정을 저장합니다.</p>
</div>
<div class="note-section">
  <div class="note-section-title">원격 — Streamable HTTP 방식</div>
  <ul>
    <li>이미 떠 있는 서버에 <strong>주소 한 줄</strong>만으로 연결합니다. 팀 모두 같은 원격 서버를 공유합니다.</li>
    <li>예시: <span class="note-kw">AWS Knowledge MCP 서버</span> — AWS 공식 문서·API·모범 사례를 검색하는 서버로, <code>url: "https://knowledge-mcp.global.api.aws"</code> 한 줄로 연결하며 별도 인증이 필요 없습니다.</li>
    <li>설정: <code>mcpServers</code> 아래 <code>"서버명": {"url": "https://..."}</code> 형태로 작성합니다.</li>
  </ul>
</div>
<div class="note-section">
  <div class="note-section-title">로컬 — stdio 방식</div>
  <ul>
    <li>Kiro가 실행 명령(<code>command</code>)과 인자(<code>args</code>)를 사용해 내 PC에서 서버를 직접 시작합니다.</li>
    <li>예시: <span class="note-kw">marp-mcp</span> — 마크다운으로 Marp 슬라이드 덱을 만들고 내보내는 도구로, <code>npx @marp-team/marp-cli</code>로 실행합니다.</li>
    <li>인증이 필요한 서버는 <code>env</code> 필드로 환경 변수(API 키 등)를 안전하게 전달합니다.</li>
  </ul>
</div>
<div class="note-case">
  <div class="note-case-label">사용 사례: 혼합 연결 구성</div>
  <p>AWS Knowledge MCP(원격 HTTP)와 사내 PostgreSQL MCP(로컬 stdio)를 동시에 연결하면, Kiro가 AWS 문서를 참고하면서 실제 사내 DB 스키마도 직접 조회하여 <strong>정확한 쿼리와 코드를 자동 생성</strong>합니다.</p>
</div>`}
{t:'Agent Hook — 자동화', h:`
<div class="note-section">
  <div class="note-section-title">Agent Hook이란</div>
  <p><span class="note-kw">Agent Hook(에이전트 훅)</span>은 특정 이벤트가 발생할 때 자동으로 작업을 수행하는 기능입니다. Steering이 "규칙"을 적용하고 Skills가 "절차"를 실행한다면, Hook은 <strong>이벤트에 반응하는 자동화</strong>입니다. 개발자가 직접 확인하지 않아도 반복 검사와 자동화 작업이 수행됩니다.</p>
</div>
<div class="note-section">
  <div class="note-section-title">Hook의 효과 — 전후 비교</div>
  <ul>
    <li><span class="note-kw">Hook이 없을 때</span>: 사용자 개인정보를 입력하다 전화번호 <strong>010-1234-5678</strong>이 든 채로 저장됩니다. 바쁘면 아무도 눈치채지 못한 채 지나갑니다.</li>
    <li><span class="note-kw">Hook이 있을 때</span>: 파일이 저장되는 그 순간 "전화번호가 마스킹 없이 노출되어 있습니다"라는 경고가 자동으로 표시됩니다. 사람이 안 챙겨도 매번 자동으로 검사합니다.</li>
    <li>설정 파일 위치: <code>.kiro/hooks/privacy-check.json</code></li>
  </ul>
</div>
<div class="note-section">
  <div class="note-section-title">Hook 설정 JSON 구조</div>
  <p>Hook 설정은 <code>.kiro/hooks/</code> 폴더의 JSON 파일로 관리합니다. <code>version</code>은 "v1", <code>hooks</code> 배열에 각 Hook을 정의합니다. 각 Hook은 <code>name</code>(이름), <code>trigger</code>(이벤트 타입), <code>matcher</code>(대상 파일 패턴), <code>action</code>(실행할 작업)으로 구성됩니다.</p>
</div>
<div class="note-case">
  <div class="note-case-label">사용 사례: 개인정보 자동 감지</div>
  <p>TypeScript·React 파일(<code>.ts</code>, <code>.tsx</code>)이 저장될 때마다 "전화번호나 마스킹되지 않은 이름이 있으면 경고"하는 Hook을 설정하면, <strong>바쁜 개발자가 놓쳐도 자동으로 개인정보 보호 규칙이 지켜집니다.</strong></p>
</div>`}
{t:'Hook 적용', h:`
<div class="note-section">
  <div class="note-section-title">PostFileSave 트리거 활용</div>
  <p><span class="note-kw">PostFileSave 트리거</span>는 에이전트가 파일을 저장하는 시점에 발생합니다. 이 트리거를 사용하면 저장 직후 자동으로 개인정보 검사, 코드 포맷팅, 문서 업데이트 등을 실행할 수 있습니다. Hook 설정 파일은 <code>.kiro/hooks/privacy-check.json</code>에 작성합니다.</p>
</div>
<div class="note-section">
  <div class="note-section-title">Hook JSON 설정 네 가지 핵심 요소</div>
  <ul>
    <li><span class="note-kw">파일 저장(1)</span>: 에이전트가 파일을 저장하는 순간 <code>trigger: "PostFileSave"</code>가 발생합니다.</li>
    <li><span class="note-kw">대상 선별(2)</span>: <code>matcher</code> 정규식(<code>\.( ts|tsx)$</code>)과 일치하는 파일만 Hook이 실행됩니다.</li>
    <li><span class="note-kw">검사 지시(3)</span>: <code>action.type: "agent"</code>와 <code>prompt</code>로 AI에게 검사 지시사항을 자연어로 전달합니다.</li>
    <li><span class="note-kw">결과 보고(4)</span>: AI가 검사 결과를 개발자에게 알립니다 — 개인정보가 있으면 경고를 출력합니다.</li>
  </ul>
</div>
<div class="note-section">
  <div class="note-section-title">직접 작성 불필요</div>
  <p>이 JSON 구조를 외울 필요는 없습니다. "TypeScript 파일 저장 시 전화번호나 마스킹되지 않은 이름이 있으면 경고해줘"라고 자연어로 설명하면 <strong>Kiro가 Hook JSON 파일을 자동으로 만들어 줍니다.</strong></p>
</div>
<div class="note-case">
  <div class="note-case-label">사용 사례: 저장 시 설명 주석 자동 추가</div>
  <p>JavaScript 파일이 저장될 때마다 "함수에 설명 주석이 없으면 자동으로 추가하라"는 Hook을 설정하면 <strong>코드베이스 전체의 문서화 수준이 일관되게 유지</strong>되며, 개발자가 별도로 확인하지 않아도 됩니다.</p>
</div>`}
{t:'Hook 적용 시점 — 트리거 10가지', h:`
<div class="note-section">
  <div class="note-section-title">10가지 트리거 타입 개요</div>
  <p>Kiro Agent Hook은 개발 워크플로의 주요 이벤트에 반응하는 <span class="note-kw">10가지 트리거 타입(Trigger Types)</span>을 제공합니다. <code>.kiro/hooks/</code> JSON 파일의 <code>trigger</code> 필드에 원하는 트리거 이름을 지정하면, 해당 이벤트 발생 시 자동으로 Hook이 실행됩니다.</p>
</div>
<div class="note-section">
  <div class="note-section-title">5가지 이벤트 카테고리별 트리거</div>
  <ul>
    <li><span class="note-kw">파일 이벤트</span>: <code>PostFileCreate</code>·<code>PostFileSave</code>·<code>PostFileDelete</code> — 파일 생성·저장·삭제 시. 저장할 때마다 맞춤법·개인정보 검사 자동화에 활용합니다.</li>
    <li><span class="note-kw">프롬프트 이벤트</span>: <code>UserPromptSubmit</code> — 프롬프트 전송 시. 민감정보 검사, 컨텍스트 자동 추가에 활용합니다.</li>
    <li><span class="note-kw">도구 이벤트</span>: <code>PreToolUse</code>·<code>PostToolUse</code> — 도구 호출 전·후. 위험한 작업 확인, 호출 기록 남기기에 활용합니다.</li>
    <li><span class="note-kw">태스크 이벤트</span>: <code>PreTaskExec</code>·<code>PostTaskExec</code> — 태스크 시작 전·완료 후. 환경 사전 확인, 완료 후 테스트 자동 실행에 활용합니다.</li>
    <li><span class="note-kw">세션 이벤트</span>: <code>SessionStart</code>·<code>Stop</code> — 세션 시작·턴 완료 시. 시작 시 컨텍스트 준비, 마무리 점검에 활용합니다.</li>
  </ul>
</div>
<div class="note-section">
  <div class="note-section-title">트리거 선택 전략</div>
  <p>파일 변경 감지에는 <code>PostFileSave</code>, 사용자 요청 전 사전 검사에는 <code>UserPromptSubmit</code>, 데이터베이스 삭제 같은 위험 작업 이중 확인에는 <code>PreToolUse</code>를 사용합니다. 이벤트 발생 직전에 실행해야 하면 <code>Pre-</code>, 완료 직후라면 <code>Post-</code>를 선택합니다.</p>
</div>
<div class="note-case">
  <div class="note-case-label">사용 사례: 위험 작업 이중 확인</div>
  <p><code>PreToolUse</code>에서 데이터베이스 삭제(DELETE) 명령이 감지되면 "정말 삭제하시겠습니까? 대상 레코드 수: N건"을 출력하는 Hook을 설정하면 <strong>에이전트가 실수로 데이터를 삭제하는 사고를 사전에 방지</strong>합니다.</p>
</div>`},
  {t:'애플리케이션 요건 명세서 작성', h:`
<div class="note-section"><div class="note-section-title">이 섹션의 목적</div>
<p>지금까지 Kiro의 기능(Spec, Steering, MCP, Hook)을 배웠습니다. 이번 섹션에서는 AI에게 애플리케이션을 만들어 달라고 할 때 <span class="note-kw">무엇을 알려줘야 하는지</span>를 다룹니다. 개발 경험이 없어도 애플리케이션이 어떤 부분으로 이루어지는지 알면 훨씬 정확한 요청을 할 수 있습니다.</p>
</div>
<div class="note-section"><div class="note-section-title">세 가지 질문</div>
<ul><li><strong>무엇을(WHAT)</strong>: 어떤 페이지와 기능이 필요한가</li><li><strong>무엇으로(WITH)</strong>: 어떤 언어·프레임워크·데이터베이스로 만들 것인가</li><li><strong>어떻게(HOW)</strong>: 계층끼리 주고받는 API, 저장할 데이터, 지켜야 할 규칙</li></ul><p>"무엇을"만 말하면 나머지는 AI가 추측으로 채웁니다. 이 섹션의 마지막에서 그 차이를 비교합니다.</p>
</div>
`},
  {t:'애플리케이션은 어떻게 동작할까', h:`
<div class="note-section"><div class="note-section-title">식당 비유</div>
<p>웹 애플리케이션을 식당에 비유하면 이해가 쉽습니다. <strong>홀</strong>(프론트엔드)은 손님이 보고 주문하는 곳, <strong>주문서</strong>(API)는 홀과 주방이 주고받는 약속된 양식, <strong>주방</strong>(백엔드)은 주문을 처리하는 곳, <strong>창고·장부</strong>(데이터베이스)는 재료와 기록을 보관하는 곳입니다.</p>
</div>
<div class="note-section"><div class="note-section-title">장바구니 담기 흐름</div>
<ul><li>① 사용자가 상품 페이지에서 "장바구니 담기"를 누릅니다.</li><li>② 프론트엔드가 백엔드에 <code>POST /cart</code> 요청을 보냅니다.</li><li>③ 백엔드가 상품과 수량이 올바른지 확인합니다.</li><li>④ 데이터베이스의 장바구니 표에 기록합니다.</li><li>⑤ 결과가 돌아와 화면의 장바구니 개수가 바뀝니다.</li></ul><p>버튼 하나를 눌러도 이렇게 여러 부분이 함께 동작합니다.</p>
</div>
`},
  {t:'3계층 아키텍처', h:`
<div class="note-section"><div class="note-section-title">3계층(3-tier)이란</div>
<p>애플리케이션을 <span class="note-kw">화면(프레젠테이션) · 로직(애플리케이션) · 데이터</span> 세 계층으로 나누는 구조입니다. 계층을 나누면 화면만 바꾸거나 데이터베이스만 교체하는 식으로 각 부분을 따로 만들고 고칠 수 있습니다.</p>
</div>
<div class="note-section"><div class="note-section-title">계층 사이의 연결</div>
<ul><li><strong>프론트엔드 ↔ 백엔드</strong>: HTTP로 JSON 데이터를 주고받는 API</li><li><strong>백엔드 ↔ 데이터베이스</strong>: SQL 쿼리로 데이터를 저장·조회</li></ul>
</div>
<div class="note-section"><div class="note-section-title">구분하는 기준</div>
<p>내 브라우저 안에서 끝나는 일(화면 표시, 클릭 반응)은 프론트엔드가, 다른 사람과 공유하거나 오래 남겨야 하는 일(주문 저장, 재고 관리)은 백엔드와 데이터베이스가 맡습니다.</p>
</div>
`},
  {t:'프론트엔드 — 화면을 그린다', h:`
<div class="note-section"><div class="note-section-title">프론트엔드가 하는 일</div>
<p>사용자가 보고 클릭하는 모든 것을 만듭니다. 화면 구성, 디자인, 사용자 반응 처리, 그리고 백엔드 API를 호출해 결과를 보여주는 일을 합니다.</p>
</div>
<div class="note-section"><div class="note-section-title">대표 기술</div>
