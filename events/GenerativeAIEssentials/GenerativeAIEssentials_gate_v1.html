<!doctype html>
<html lang="ko" class="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의장 입장 — Generative AI Essentials on AWS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1219;--bg-alt:#161618;--bg-soft:#1b1f27;--brand1:#e65100;--brand2:#f57c00;--brand3:#ff9800;--t1:#dfdfd6;--t2:#98989f;--border:#3c3f44;}
  html.light{--bg:#ffffff;--bg-alt:#f6f7f9;--bg-soft:#eef0f3;--t1:#1a1f29;--t2:#5b6678;--border:#e3e7ef;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
  body::before{content:"";position:absolute;top:-25%;right:-10%;width:620px;height:620px;background:radial-gradient(circle,rgba(230,81,0,.16),transparent 62%);pointer-events:none;}
  .themebtn{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);color:var(--t1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .themebtn svg{width:17px;height:17px;}
  .themebtn .moon{display:none;}
  html.light .themebtn .moon{display:block;} html.light .themebtn .sun{display:none;}
  .card{position:relative;width:100%;max-width:420px;background:var(--bg-alt);border:1px solid var(--border);border-radius:18px;padding:40px 36px 34px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12);}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand1);margin:0 0 8px;}
  h1{font-size:23px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;}
  .desc{font-size:14px;color:var(--t2);margin:0 0 26px;}
  .field{text-align:left;margin:0 0 6px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin:0 0 8px;}
  .pin-input{width:100%;height:56px;border:2px solid var(--border);border-radius:12px;background:var(--bg-soft);color:var(--t1);
    font-size:24px;font-weight:700;text-align:center;letter-spacing:.4em;padding:0 14px;outline:none;transition:.15s;font-family:inherit;}
  .pin-input::placeholder{color:var(--t2);letter-spacing:.1em;font-weight:500;font-size:16px;}
  .pin-input:focus{border-color:var(--brand2);}
  .pin-input.err{border-color:#e5484d;animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .msg{min-height:20px;font-size:13px;margin:10px 0 0;color:#e5484d;}
  .btn{margin-top:18px;width:100%;height:52px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--brand1),var(--brand2));
    color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.1s;font-family:inherit;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .foot{margin-top:22px;font-size:12px;color:var(--t2);}
  .foot a{color:var(--t2);text-decoration:underline;}
</style>
</head>
<body>
  <button class="themebtn" id="themeToggle" aria-label="배경 전환" title="배경 전환"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>

  <div class="card">
    <p class="eyebrow">Generative AI Essentials on AWS</p>
    <h1>강의장 입장</h1>
    <p class="desc">강사가 안내한 <b>세션 PIN</b>을 입력하세요.</p>

    <div class="field">
      <label for="pin">세션 PIN</label>
      <input class="pin-input" id="pin" type="text" inputmode="numeric" autocomplete="off"
             placeholder="PIN 입력" autofocus>
    </div>
    <div class="msg" id="msg"></div>

    <button class="btn" id="enter">입장하기</button>

    <p class="foot"><a href="./GenerativeAIEssentials_intro_v1.html">← 강의 소개로 돌아가기</a></p>
  </div>

<script>
  // ===== 설정: 강의마다 이 PIN만 바꾸면 됩니다 =====
  var SESSION_PIN = "1234";
  var TARGET = "./learn/";
  // ===============================================

  var input = document.getElementById('pin');
  var msg = document.getElementById('msg');

  function submit(){
    var v = (input.value || "").trim();
    if(!v){ msg.style.color="#e5484d"; msg.textContent="PIN을 입력해 주세요."; input.focus(); return; }
    if(v === SESSION_PIN){
      msg.style.color="#1f8a4c"; msg.textContent="입장합니다…";
      window.location.href = TARGET;
    } else {
      msg.style.color="#e5484d"; msg.textContent="PIN이 올바르지 않습니다. 다시 입력해 주세요.";
      input.classList.add('err'); input.value=""; input.focus();
      setTimeout(function(){ input.classList.remove('err'); }, 350);
    }
  }
  document.getElementById('enter').addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  input.addEventListener('input', function(){ msg.textContent=""; });

  var tb=document.getElementById('themeToggle');
  if(tb) tb.addEventListener('click', function(){ document.documentElement.classList.toggle('light'); });
</script>
</body>
</html>
