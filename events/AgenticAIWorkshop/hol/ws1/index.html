<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop 1 · Kiro Basic — Agentic AI Workshop</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
/* === 변수 · 테마 === */
:root{
  --bg:#f6f8f7;--surface:#ffffff;--ink:#0f172a;--ink-2:#334155;--muted:#64748b;
  --border:#e2e8f0;--primary:#00592D;--primary-2:#0a7d42;
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  --hdr:52px;--aside:240px;
}
[data-theme=dark]{
  --bg:#0b1020;--surface:#131a2e;--ink:#e2e8f0;--ink-2:#94a3b8;--muted:#475569;
  --border:#1e2a44;--primary:#22c55e;--primary-2:#4ade80;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6}
body{display:flex;flex-direction:column}

/* === 헤더 바 === */
.hdr{height:var(--hdr);flex:none;display:flex;align-items:center;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);gap:10px;z-index:10}
.hdr-logo{font-size:13.5px;font-weight:800;color:var(--ink)}
.hdr-sp{flex:1}
.theme-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--muted);font-family:var(--font);transition:all .15s}
.theme-btn:hover{border-color:var(--primary-2);color:var(--primary-2)}

/* === 레이아웃 === */
.layout{flex:1;display:flex;overflow:hidden}

/* === 사이드바 === */
aside{width:var(--aside);flex:none;display:flex;flex-direction:column;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:12px 0 16px}

/* navday */
.navday{margin:0 0 2px}
.navday-hd{width:100%;background:none;border:none;padding:9px 14px;display:flex;align-items:center;gap:7px;font-family:var(--font);font-size:12.5px;font-weight:800;color:var(--ink-2);cursor:pointer;text-align:left;transition:background .12s}
.navday-hd:hover{background:rgba(0,89,45,.06)}
[data-theme=dark] .navday-hd:hover{background:rgba(34,197,94,.06)}
.navday-arr{font-size:10px;transition:transform .2s;color:var(--muted)}
.navday.open .navday-arr{transform:rotate(90deg)}
.navday-name{flex:1;font-size:12px;line-height:1.35}
.navday-body{display:none;padding:0 0 4px}
.navday.open .navday-body{display:block}
.navday-body a{display:block;padding:7px 14px 7px 28px;font-size:12.5px;color:var(--ink-2);text-decoration:none;transition:background .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navday-body a:hover{background:rgba(0,89,45,.06);color:var(--primary-2)}
.navday-body a.active{background:#e7f5ec;color:var(--primary);font-weight:800;border-right:3px solid var(--primary)}
[data-theme=dark] .navday-body a.active{background:#0a2e1a}

/* 진행 현황 */
.prog-box{margin:12px 10px 0;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.prog-title{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.prog-item{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.prog-item input[type=checkbox]{accent-color:var(--primary);width:13px;height:13px;flex:none}

/* 나가기 */
.exit-btn{display:block;margin:14px 10px 0;padding:9px 14px;background:none;border:1px solid var(--border);border-radius:9px;font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none;text-align:center;transition:all .15s}
.exit-btn:hover{border-color:#dc2626;color:#dc2626;background:#fff5f5}

/* === 메인 (iframe) === */
main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.guide-frame{flex:1;border:none;width:100%;height:100%}
</style>
</head>
<body>

<!-- 헤더 바 -->
<header class="hdr">
  <span class="hdr-logo">Agentic AI Workshop on AWS</span>
  <span class="hdr-sp"></span>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 다크</button>
</header>

<div class="layout">

  <!-- 사이드바 -->
  <aside>

    <!-- Day 1 (열림 · 활성) -->
    <div class="navday open" id="nd1">
      <button class="navday-hd" onclick="toggleDay('nd1')">
        <span class="navday-arr">▶</span>
        <span class="navday-name">Day 1<br><small style="font-weight:500;font-size:10.5px;opacity:.8">Generative AI 이해하기</small></span>
      </button>
      <div class="navday-body">
        <a href="../../learn/day1/">Day 1 개요</a>
        <a href="../../day1/m1/">M1. Kiro 소개</a>
        <a href="../../day1/m2/">M2. AI 이해하기</a>
        <a href="#" class="active">Workshop 1. Kiro Basic</a>
      </div>
    </div>

    <!-- Day 2 -->
    <div class="navday" id="nd2">
      <button class="navday-hd" onclick="toggleDay('nd2')">
        <span class="navday-arr">▶</span>
        <span class="navday-name">Day 2<br><small style="font-weight:500;font-size:10.5px;opacity:.8">Developing GenAI App on AWS</small></span>
      </button>
      <div class="navday-body">
        <a href="../../learn/day2/">Day 2 개요</a>
        <a href="../../day2/m3/">M3. Amazon Bedrock 활용</a>
        <a href="../../day2/m4/">M4. Agentic AI &amp; MCP</a>
      </div>
    </div>

    <!-- Day 3 -->
    <div class="navday" id="nd3">
      <button class="navday-hd" onclick="toggleDay('nd3')">
        <span class="navday-arr">▶</span>
        <span class="navday-name">Day 3<br><small style="font-weight:500;font-size:10.5px;opacity:.8">Strands Agents &amp; AgentCore</small></span>
      </button>
      <div class="navday-body">
        <a href="../../learn/day3/">Day 3 개요</a>
        <a href="../../day3/m5/">M5. Strands Agents SDK</a>
        <a href="../../day3/m6/">M6. Amazon Bedrock AgentCore</a>
      </div>
    </div>

    <!-- Day 4 -->
    <div class="navday" id="nd4">
      <button class="navday-hd" onclick="toggleDay('nd4')">
        <span class="navday-arr">▶</span>
        <span class="navday-name">Day 4<br><small style="font-weight:500;font-size:10.5px;opacity:.8">Kiro 고급 기능</small></span>
      </button>
      <div class="navday-body">
        <a href="../../learn/day4/">Day 4 개요</a>
        <a href="../../day4/m7/">M7. Kiro 고급 기능</a>
      </div>
    </div>

    <!-- 진행 현황 -->
    <div class="prog-box">
      <div class="prog-title">진행 현황</div>
      <label class="prog-item"><input type="checkbox" onchange="saveProg()" id="p0"> 사전 준비</label>
      <label class="prog-item"><input type="checkbox" onchange="saveProg()" id="p1"> Task 1 — 폴더 생성</label>
      <label class="prog-item"><input type="checkbox" onchange="saveProg()" id="p2"> Task 2 — 폴더 열기</label>
      <label class="prog-item"><input type="checkbox" onchange="saveProg()" id="p3"> Task 3 — 터미널 확인</label>
      <label class="prog-item"><input type="checkbox" onchange="saveProg()" id="p4"> Task 4 — 환경 준비</label>
      <label class="prog-item"><input type="checkbox" onchange="saveProg()" id="p5"> Lab 5 — Vibe Coding</label>
    </div>

    <!-- 나가기 -->
    <a class="exit-btn" href="../../AgenticAIWorkshop_intro_v1.html">🚪 강의실 나가기</a>

  </aside>

  <!-- 가이드 iframe -->
  <main>
    <iframe class="guide-frame" src="./ws1guide.html" title="Workshop 1 가이드"></iframe>
  </main>

</div>

<script>
/* PIN 접근 제어 */
if (!sessionStorage.getItem('aawClassAccess')
    && location.hostname !== 'localhost'
    && location.hostname !== '127.0.0.1') {
  window.location.replace('../../AgenticAIWorkshop_gate_v1.html');
}

/* 사이드바 Day 토글 */
function toggleDay(id) {
  document.getElementById(id).classList.toggle('open');
}

/* 테마 토글 */
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙 다크' : '☀️ 라이트';
  localStorage.setItem('aawTheme', isDark ? 'light' : 'dark');
}
(function(){
  const t = localStorage.getItem('aawTheme');
  if (t) {
    document.documentElement.setAttribute('data-theme', t);
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = t === 'dark' ? '☀️ 라이트' : '🌙 다크';
  }
})();

/* 진행 현황 저장/복원 */
function saveProg() {
  const s = {};
  for (let i = 0; i <= 5; i++) {
    const el = document.getElementById('p' + i);
    if (el) s['ws1_p' + i] = el.checked;
  }
  localStorage.setItem('ws1prog', JSON.stringify(s));
}
(function(){
  try {
    const d = JSON.parse(localStorage.getItem('ws1prog') || '{}');
    for (let i = 0; i <= 5; i++) {
      const el = document.getElementById('p' + i);
      if (el && d['ws1_p' + i]) el.checked = true;
    }
  } catch(e) {}
})();
</script>
</body>
</html>
