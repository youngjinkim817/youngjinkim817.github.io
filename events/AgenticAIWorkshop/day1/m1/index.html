<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1. Kiro 소개 — Agentic AI Workshop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{--bg:#fff;--bg-alt:#f8f7ff;--bg-soft:#ede9fe;--primary:#211E62;--secondary:#0891B2;--t1:#1e1b4b;--t2:#4338CA;--t3:#6B7280;--border:#c7d2fe;--tag:#ede9fe;--sh:0 2px 8px rgba(33,30,98,.08);}
html.dark{--bg:#0a0a0a;--bg-alt:#111111;--bg-soft:#1a1a2e;--primary:#818CF8;--secondary:#22D3EE;--t1:#F1F5F9;--t2:#94A3B8;--t3:#64748B;--border:#1e293b;--tag:#1e1b4b;}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:16px;line-height:1.75;}
/* 헤더 */
header.top{position:sticky;top:0;z-index:200;height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff;border-bottom:2px solid var(--border);}
html.dark header.top{background:#0a0a0a;border-bottom-color:#3a3a6a;}
.brand{font-weight:800;font-size:17px;color:var(--primary);}
.brand b{color:var(--secondary);}
.themebtn{margin-left:auto;width:32px;height:32px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);color:var(--t1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.themebtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
.themebtn .moon{display:block;}.themebtn .sun{display:none;}
html.dark .themebtn .moon{display:none;}html.dark .themebtn .sun{display:block;}
/* 레이아웃 */
.layout{display:grid;grid-template-columns:234px 1fr;min-height:calc(100vh - 58px);}
/* 사이드바 */
aside{border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto;position:sticky;top:58px;height:calc(100vh - 58px);background:var(--bg);display:flex;flex-direction:column;gap:2px;}
html.dark aside{border-right-color:#3a3a6a;}
.navday{margin-bottom:2px;}
.navday-hd{display:flex;align-items:flex-start;gap:7px;width:100%;padding:7px 8px;border-radius:8px;background:transparent;border:none;cursor:pointer;text-align:left;font-family:inherit;color:var(--t1);}
.navday-hd:hover{background:var(--tag);}
.navday-arr{width:13px;height:13px;flex-shrink:0;margin-top:3px;color:var(--t3);transition:transform .2s;fill:none;stroke:currentColor;stroke-width:2.5;}
.navday.open>.navday-hd .navday-arr{transform:rotate(90deg);}
.navday-badge{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--secondary);}
.navday-name{font-size:11.5px;font-weight:600;line-height:1.35;color:var(--t1);}
.navday-body{padding:2px 0 4px 20px;border-left:2px solid var(--border);margin-left:12px;display:none;}
.navday.open>.navday-body{display:block;}
html.dark .navday-body{border-left-color:#3a3a6a;}
.nav-module{display:block;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--t1);border-left:2px solid transparent;text-decoration:none;transition:background .12s;}
.nav-module:hover{background:var(--tag);color:var(--primary);}
.nav-module.active{background:var(--tag);border-left-color:var(--primary);color:var(--primary);font-weight:700;}
.nav-module.locked{opacity:.4;pointer-events:none;}
html.dark .nav-module{color:#F1F5F9!important;}
html.dark .nav-module.active{background:rgba(129,140,248,.15)!important;border-left-color:#818CF8!important;color:#818CF8!important;}
.prog-box{margin-top:12px;padding:10px 12px;background:var(--bg-alt);border-radius:10px;border:1px solid var(--border);}
.prog-box-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.prog-counts{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:5px;}
.prog-bar{height:3px;background:#e0e0e8;border-radius:2px;overflow:hidden;}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:2px;transition:width .3s;}
.exit-btn{display:flex;align-items:center;gap:7px;margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(239,68,68,.07);border:1.5px solid rgba(239,68,68,.2);color:#b91c1c;font-size:12px;font-weight:700;text-decoration:none;}
.exit-btn:hover{background:rgba(239,68,68,.14);}
/* 메인 */
main{padding:14px 18px 68px;width:100%;}
/* 슬라이드 뷰어 — iframe으로 slides.html 전체 표시 */
.svis{background:#0b1020;border-radius:12px;border:1px solid var(--border);box-shadow:var(--sh);position:relative;overflow:hidden;width:100%;aspect-ratio:16/9;}
html.dark .svis{border-color:#3a3a6a;}
#slideFrame{width:100%;height:100%;border:none;display:block;}
/* 전체화면 버튼 */
.svis-expand{position:absolute;bottom:9px;right:9px;z-index:50;height:27px;padding:0 11px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;backdrop-filter:blur(6px);font-family:inherit;}
.svis-expand:hover{background:rgba(255,255,255,.18);}
/* 노트 패널 */
.npanel{background:var(--bg-alt);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-top:10px;box-shadow:var(--sh);font-size:14px;line-height:1.82;}
html.dark .npanel{background:#111111;border-color:#3a3a6a;}
.np-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px;}
html.dark .np-hd{border-bottom-color:#3a3a6a;}
.np-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--secondary);}
.np-title{font-size:13px;font-weight:700;color:var(--primary);}
html.dark .np-title{color:#818CF8;}
.note-section{margin-bottom:12px;}
.note-section-title{font-size:11px;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);padding-bottom:3px;margin-bottom:7px;}
html.dark .note-section-title{border-bottom-color:#3a3a6a;color:#22D3EE;}
.note-kw{font-weight:700;color:var(--secondary);}
html.dark .note-kw{color:#22D3EE;}
.note-case{background:rgba(8,145,178,.07);border-left:3px solid var(--secondary);border-radius:0 8px 8px 0;padding:9px 13px;margin:8px 0;}
html.dark .note-case{background:rgba(34,211,238,.07);border-left-color:#22D3EE;}
.note-case-label{font-size:10px;font-weight:800;color:var(--secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
html.dark .note-case-label{color:#22D3EE;}
.npanel ul,.npanel ol{padding-left:18px;margin:3px 0;}
.npanel li{margin-bottom:3px;}
code{background:rgba(8,145,178,.1);color:var(--secondary);border-radius:4px;padding:1px 6px;font-size:12px;}
/* 하단 네비 */
.sticknav{position:fixed;bottom:0;left:0;right:0;z-index:300;background:var(--bg-alt);border-top:1px solid var(--border);padding:6px 20px;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 -4px 14px rgba(0,0,0,.07);}
html.dark .sticknav{background:#0a0a0a;border-top-color:#3a3a6a;}
.sticknav button{background:var(--bg-soft);border:1px solid var(--border);color:var(--t1);padding:6px 18px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;font-family:inherit;}
.sticknav button:hover:not(:disabled){background:var(--primary);border-color:var(--primary);color:#fff;}
.sticknav button:disabled{opacity:.3;cursor:default;}
.sticknav-cnt{font-size:14px;color:var(--secondary);min-width:52px;text-align:center;font-weight:700;}
/* 전체화면 오버레이 */
#fsOverlay{position:fixed;inset:0;z-index:900;background:#0b1020;display:none;flex-direction:column;}
#fsOverlay.on{display:flex;}
.fs-bar{height:40px;flex-shrink:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:space-between;padding:0 14px;}
.fs-info{color:rgba(255,255,255,.7);font-size:12px;font-weight:600;}
.fs-nav-btns{display:flex;align-items:center;gap:8px;}
.fs-nav-btns button{height:28px;padding:0 12px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.fs-nav-btns button:hover{background:rgba(255,255,255,.2);}
.fs-cnt{color:rgba(255,255,255,.8);font-size:12px;font-weight:700;min-width:48px;text-align:center;}
.fs-close{height:28px;padding:0 12px;border-radius:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.fs-close:hover{background:rgba(255,255,255,.22);}
#fsFrame{flex:1;width:100%;border:none;display:block;}
html.dark *{--border:#3a3a6a!important;}
html.dark body,html.dark aside,html.dark main,html.dark .sticknav{background-color:#0a0a0a;}
html.dark .navday-name{color:#F1F5F9!important;}
html.dark .sticknav-cnt{color:#22D3EE!important;}
</style>
</head>

<script>
var N = 16, cur = 0;
var frameReady = false;
var fsFrameReady = false;

// ── iframe 로드 완료 후 슬라이드 동기화 ──
document.getElementById('slideFrame').addEventListener('load', function() {
  frameReady = true;
  slideGo(cur);
});
document.getElementById('fsFrame').addEventListener('load', function() {
  fsFrameReady = true;
  fsSlideGo(cur);
});

// ── iframe 슬라이드 이동 (window.kiroGo 직접 호출) ──
function slideGo(n) {
  if (!frameReady) return;
  var fw;
  try { fw = document.getElementById('slideFrame').contentWindow; } catch(e) { return; }
  if (!fw) return;

  // 방법 1: window.kiroGo (커스텀 래퍼)
  if (typeof fw.kiroGo === 'function') { fw.kiroGo(n); return; }
  // 방법 2: window.go (함수 선언 — 전역 자동 노출)
  if (typeof fw.go === 'function') { fw.go(n); return; }
  // 방법 3: 버튼 클릭 시뮬레이션
  var iCur = (fw.cur !== undefined) ? fw.cur : 0;
  var diff = n - iCur;
  var btnId = diff >= 0 ? 'next' : 'prev';
  try {
    var btn = fw.document.getElementById(btnId);
    if (btn) for (var i=0; i<Math.abs(diff); i++) btn.click();
  } catch(e) {}
}
function fsSlideGo(n) {
  if (!fsFrameReady) return;
  var fw;
  try { fw = document.getElementById('fsFrame').contentWindow; } catch(e) { return; }
  if (!fw) return;
  if (typeof fw.kiroGo === 'function') { try { fw.kiroGo(n); } catch(e) {} return; }
  if (typeof fw.go === 'function') { try { fw.go(n); } catch(e) {} return; }
  var iCur = (fw.cur !== undefined) ? fw.cur : 0;
  var diff = n - iCur;
  var btnId = diff >= 0 ? 'next' : 'prev';
  try {
    var btn = fw.document.getElementById(btnId);
    if (btn) for (var i=0; i<Math.abs(diff); i++) btn.click();
  } catch(e) {}
}

// ── 슬라이드 이동 ──
function goTo(n) {
  if (n < 0 || n >= N) return;
  cur = n;
  // 슬라이드 iframe 이동 (에러가 나도 UI 업데이트는 계속 진행)
  try { slideGo(cur); } catch(e) {}
  try {
    if (document.getElementById('fsOverlay').classList.contains('on')) fsSlideGo(cur);
  } catch(e) {}
  // 진행 상황 업데이트
  var d = (cur+1) + ' / ' + N;
  try { document.getElementById('progText').textContent = d; } catch(e) {}
  try { document.getElementById('progFill').style.width = ((cur+1)/N*100).toFixed(1)+'%'; } catch(e) {}
  try { document.getElementById('snCnt').textContent = d; } catch(e) {}
  try { document.getElementById('fsCnt').textContent = d; } catch(e) {}
  try { document.getElementById('fsInfo').textContent = 'M1. Kiro 소개 — ' + d; } catch(e) {}
  try {
    document.getElementById('btnPrev').disabled = cur===0;
    document.getElementById('btnNext').disabled = cur===N-1;
  } catch(e) {}
  // 노트 업데이트
  var nd = NOTES[cur];
  if (nd) {
    try { document.getElementById('npTitle').textContent = (cur+1)+'. '+nd.t; } catch(e) {}
    try { document.getElementById('npBody').innerHTML = nd.h; } catch(e) {}
  }
}
function nav(d) { goTo(cur + d); }

// ── 전체화면 ──
function openFS() {
  document.getElementById('fsOverlay').classList.add('on');
  document.getElementById('expandBtn').textContent = '✕ 닫기';
  document.getElementById('expandBtn').onclick = closeFS;
  setTimeout(function() { fsSlideGo(cur); }, 500);
}
function closeFS() {
  document.getElementById('fsOverlay').classList.remove('on');
  document.getElementById('expandBtn').textContent = '⛶ 전체화면';
  document.getElementById('expandBtn').onclick = openFS;
}

// ── Day 토글 ──
function toggleDay(id) { document.getElementById(id).classList.toggle('open'); }

// ── 테마 ──
(function() {
  if (localStorage.getItem('aawTheme')==='dark') document.documentElement.classList.add('dark');
  document.getElementById('themeToggle').addEventListener('click', function() {
    var d = document.documentElement.classList.toggle('dark');
    localStorage.setItem('aawTheme', d?'dark':'light');
  });
})();

// ── 키보드 ──
document.addEventListener('keydown', function(e) {
  if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); nav(1); }
  if (e.key==='ArrowLeft') { e.preventDefault(); nav(-1); }
  if (e.key==='Escape') closeFS();
});

// ── 슬라이드 노트 데이터 ──
var NOTES = [
  {t:'AI 개발 도구는 진화하고 있다',h:"<div class='note-section'><div class='note-section-title'>핵심 개념</div><p>AI 개발 도구는 <span class='note-kw'>자동완성(Auto-complete)</span> → <span class='note-kw'>코드 어시스턴트(Assistant)</span> → <span class='note-kw'>AI 에이전트(Agent)</span> → <span class='note-kw'>자율 개발(Autonomy)</span>으로 진화합니다. 자율성이 높아질수록 개발자의 역할은 '코드 작성자'에서 '방향 제시자·검토자'로 전환됩니다.</p></div><div class='note-section'><div class='note-section-title'>단계별 특징</div><ul><li><span class='note-kw'>~2023 자동완성</span>: GitHub Copilot 1세대 — 다음 줄·토큰 예측. 개발자가 수락 결정</li><li><span class='note-kw'>2024 어시스턴트</span>: 대화 기반 코드 보조. 모든 설계 결정은 개발자가</li><li><span class='note-kw'>2025 에이전트</span>: 도구 선택·실행 자율성. 파일 생성·수정·실행까지 AI 담당</li><li><span class='note-kw'>2026 자율 개발</span>: 사람 감독 하에 처음부터 끝까지 완료 — <strong>Kiro가 이 위치</strong></li></ul></div><div class='note-case'><div class='note-case-label'>핵심 인사이트</div><p>자율성이 오를수록 필요한 역량은 '얼마나 많이 짜느냐'가 아니라 <strong>'방향을 얼마나 잘 통제하느냐'</strong>로 이동합니다. Kiro의 Spec·Steering·승인 게이트가 이 통제를 담당합니다.</p></div>"},
  {t:'AI 기반 개발의 세 가지 난제',h:"<div class='note-section'><div class='note-section-title'>왜 중요한가</div><p>소규모 작업은 잘 되지만 복잡한 프로덕션 프로젝트로 확장할 때 세 가지 핵심 문제가 드러납니다. Kiro는 이 세 가지를 해결하기 위해 설계됐습니다.</p></div><div class='note-section'><div class='note-section-title'>세 가지 난제 상세</div><ul><li><span class='note-kw'>규모 확장(Scaling)</span>: 파일 수십 개·여러 서비스 구성 시 AI가 전체 맥락 유지 어려움 → Kiro Spec이 해결</li><li><span class='note-kw'>제한된 상호작용(Interaction)</span>: 언어 모호성으로 의도·제약 전달 어려움 → Kiro Steering이 해결</li><li><span class='note-kw'>코드 품질(Quality)</span>: 생성 코드 증가 시 일관성·테스트 유지 어려움 → HITL 승인 게이트·Hooks가 해결</li></ul></div>"},
  {t:'Kiro 개요',h:"<div class='note-section'><div class='note-section-title'>정의</div><p><span class='note-kw'>Kiro</span>는 AWS가 개발한 <span class='note-kw'>에이전틱 AI IDE(Agentic AI IDE)</span>입니다. 프로토타입에서 프로덕션까지 <span class='note-kw'>Spec-Driven Development</span>로 개발을 지원합니다.</p></div><div class='note-section'><div class='note-section-title'>기존 도구와의 차이</div><ul><li><strong>GitHub Copilot</strong>: 코드 라인 제안만. 설계는 개발자가 직접</li><li><strong>ChatGPT/Claude</strong>: 대화형이지만 IDE 통합 없음</li><li><strong>Kiro</strong>: IDE 안에서 요구사항 분석→설계→구현→검증 전체 수명 주기 지원</li></ul></div><div class='note-case'><div class='note-case-label'>로그인 방법</div><p>GitHub, Google, AWS Builder ID 중 하나. <strong>AWS 계정 불필요</strong>. Free 플랜으로 모든 실습 가능.</p></div>"},
  {t:'이번 과정의 도구 — Kiro',h:"<div class='note-section'><div class='note-section-title'>코딩 에이전트 세 가지 유형</div><ul><li><span class='note-kw'>Claude Code (Anthropic)</span>: 터미널 기반. 명령줄에서 파일·코드 조작</li><li><span class='note-kw'>Codex (OpenAI)</span>: 자연어→코드. ChatGPT 에코시스템 통합</li><li><span class='note-kw'>Kiro (AWS)</span>: IDE 내 대화형 에이전트. AWS 서비스 직접 연동. <strong>이번 과정의 도구</strong></li></ul></div><div class='note-section'><div class='note-section-title'>Kiro를 선택한 이유</div><p>AWS 기반 서비스(Bedrock, AgentCore, Strands)와의 직접 통합, Spec-Driven Development를 통한 체계적 개발, 프로덕션 수준 품질 달성이 목적이므로 Kiro가 최적입니다.</p></div>"},
  {t:'두 얼굴의 Kiro — IDE와 CLI',h:"<div class='note-section'><div class='note-section-title'>두 가지 형태</div><ul><li><span class='note-kw'>Kiro IDE</span>: VS Code 기반 GUI 에디터. Spec·Hooks·Powers 지원. 일반 개발에 적합</li><li><span class='note-kw'>Kiro CLI</span>: 터미널 명령줄. <code>--no-interactive</code>로 CI/CD 파이프라인 삽입 가능</li></ul></div><div class='note-case'><div class='note-case-label'>공통점</div><p>IDE와 CLI는 <strong>동일한 AI 모델과 기능 세트</strong>를 공유합니다. Spec·Hooks·Steering 모두 양쪽에서 사용 가능합니다.</p></div>"},
  {t:'Kiro 화면 구성',h:"<div class='note-section'><div class='note-section-title'>주요 화면 영역</div><ul><li><span class='note-kw'>Activity Bar (좌측 세로)</span>: Explorer, Search, Git, Kiro Panel 접근</li><li><span class='note-kw'>Editor Area</span>: 코드 편집 영역. Kiro가 직접 수정하는 곳</li><li><span class='note-kw'>Kiro Chat Panel</span>: 자연어로 지시하는 대화창. Vibe/Spec 모드 전환</li><li><span class='note-kw'>Terminal Panel (하단)</span>: 실행 로그 및 명령어 입력</li></ul></div><div class='note-section'><div class='note-section-title'>VS Code 호환성</div><p>Code OSS 기반으로 VS Code와 동일한 사용감. 기존 VS Code 확장 프로그램(.vsix)을 그대로 설치·사용 가능합니다.</p></div>"},
  {t:'실행 모드 — Autopilot · Supervised',h:"<div class='note-section'><div class='note-section-title'>두 가지 자율성 모드</div><ul><li><span class='note-kw'>Autopilot</span>: Kiro가 파일을 자율적으로 수정·생성·실행. 빠른 프로토타이핑에 적합</li><li><span class='note-kw'>Supervised</span>: 모든 변경을 사용자가 검토(Accept/Reject). 파일별·변경 덩어리(Hunk)별 승인. 프로덕션 코드에 적합</li></ul></div><div class='note-case'><div class='note-case-label'>권장 시작법</div><p>처음엔 <strong>Supervised 모드</strong>로 시작하여 AI 코드 생성 방식을 파악한 뒤, 익숙해지면 Autopilot으로 전환을 권장합니다.</p></div>"},
  {t:'Kiro 설치 및 로그인',h:"<div class='note-section'><div class='note-section-title'>설치 단계</div><ol><li><span class='note-kw'>kiro.dev</span> 접속 → OS에 맞는 파일 다운로드</li><li>설치 후 Kiro 실행</li><li>GitHub / Google / AWS Builder ID로 로그인 (AWS 계정 불필요)</li><li>Free 플랜으로 즉시 시작</li></ol></div><div class='note-section'><div class='note-section-title'>개발 도구 사전 설치 확인</div><ul><li><span class='note-kw'>Node.js 18+</span>: <code>node --version</code></li><li><span class='note-kw'>Python 3.9+</span>: Strands Agents 실습 필요</li><li><span class='note-kw'>AWS CLI</span>: Bedrock·AgentCore 실습 필요</li></ul></div>"},
  {t:'Vibe 모드 — 대화형 개발',h:"<div class='note-section'><div class='note-section-title'>Vibe Coding이란</div><p><span class='note-kw'>Vibe Coding</span>은 코드 구조를 직접 설계하지 않고 자연어로 결과를 설명하면 AI가 즉시 코드를 생성하는 방식입니다.</p></div><div class='note-section'><div class='note-section-title'>강점과 한계</div><ul><li><strong>강점</strong>: 빠른 결과, 낮은 진입장벽, 아이디어 즉시 구현</li><li><strong>한계</strong>: 대규모 프로젝트 일관성 유지 어려움, 아키텍처 결정이 즉흥적</li></ul></div><div class='note-case'><div class='note-case-label'>Workshop 1 실습</div><p>'3개 웹페이지 이커머스 사이트 만들어줘' 프롬프트로 Vibe Coding을 직접 체험합니다.</p></div>"},
  {t:'프로젝트를 스펙으로, 스펙을 코드로',h:"<div class='note-section'><div class='note-section-title'>Spec-Driven Development란</div><p><span class='note-kw'>Requirements → Design → Tasks</span>의 3단계를 거쳐 체계적으로 개발합니다. 각 단계마다 사용자가 검토·승인합니다.</p></div><div class='note-section'><div class='note-section-title'>3단계 프로세스</div><ul><li><span class='note-kw'>Requirements</span>: 기능·비기능 요구사항 문서화 → 검토·승인</li><li><span class='note-kw'>Design</span>: 아키텍처, 데이터 모델, API 설계 → 검토·승인</li><li><span class='note-kw'>Tasks</span>: 구체적 구현 태스크 목록 → 순차·병렬 실행</li></ul></div>"},
  {t:'단계마다 검토하고, 태스크는 병렬로 실행한다',h:"<div class='note-section'><div class='note-section-title'>승인 게이트 (Approval Gate)</div><p>각 단계는 <span class='note-kw'>사용자의 명시적 승인</span>이 있어야 다음 단계로 진행합니다. 이 <span class='note-kw'>HITL(Human-in-the-Loop)</span> 구조가 AI 코드 품질을 보장하는 핵심입니다.</p></div><div class='note-section'><div class='note-section-title'>태스크 실행 방식</div><ul><li><span class='note-kw'>순차</span>: 의존관계 있는 태스크는 순서대로</li><li><span class='note-kw'>병렬</span>: 독립 태스크는 동시 실행으로 속도 향상</li></ul></div><div class='note-case'><div class='note-case-label'>핵심 차이</div><p>Vibe는 즉시 코드가 나오지만 방향 수정이 어렵습니다. Spec은 <strong>각 단계에서 방향 수정이 가능</strong>해 대형 프로젝트에서 안정적입니다.</p></div>"},
  {t:'언제 Vibe, 언제 Spec',h:"<div class='note-section'><div class='note-section-title'>선택 기준</div><ul><li><span class='note-kw'>Vibe 적합</span>: 빠른 프로토타입, 아이디어 검증, 단순 스크립트, 학습용</li><li><span class='note-kw'>Spec 적합</span>: 팀 프로젝트, 프로덕션, 복잡한 비즈니스 로직, 장기 유지보수</li></ul></div><div class='note-section'><div class='note-section-title'>실무 팁</div><p>혼합 방식이 가장 효과적: <strong>Vibe로 아이디어 검증 → 프로덕션 전환 시 Spec으로 재구조화</strong>. Workshop 1에서 두 방식을 모두 체험합니다.</p></div>"},
  {t:'Kiro CLI — 터미널에서',h:"<div class='note-section'><div class='note-section-title'>설치 및 주요 명령어</div><ul><li><code>npm install -g @aws/kiro-cli</code>: 설치</li><li><code>kiro '자연어 요청'</code>: Vibe 모드 즉시 실행</li><li><code>kiro spec '요청'</code>: Spec 기반 개발</li><li><code>kiro --no-interactive '요청'</code>: CI/CD 헤드리스 실행</li></ul></div><div class='note-case'><div class='note-case-label'>CI/CD 통합</div><p>GitHub Actions에서 <code>kiro --no-interactive</code>로 자동화된 코드 생성·검증 파이프라인 구축 가능. <strong>Day 4</strong>에서 심화 학습합니다.</p></div>"},
  {t:'Kiro IDE와 Kiro CLI',h:"<div class='note-section'><div class='note-section-title'>상세 비교</div><ul><li><span class='note-kw'>인터페이스</span>: IDE — GUI | CLI — 터미널</li><li><span class='note-kw'>자동화</span>: IDE — 수동 트리거 | CLI — 스크립트·파이프라인</li><li><span class='note-kw'>적합 대상</span>: IDE — 일반 개발자 | CLI — DevOps·자동화</li><li><span class='note-kw'>Spec/Hooks/Powers</span>: 양쪽 모두 동일 지원</li></ul></div><div class='note-section'><div class='note-section-title'>이번 과정</div><p>Day 1~3은 Kiro IDE 중심. Day 4에서 CLI 자동화와 CI/CD 통합을 다룹니다.</p></div>"},
  {t:'Kiro를 움직이는 다섯 가지 장치',h:"<div class='note-section'><div class='note-section-title'>다섯 가지 핵심 장치</div><ul><li><span class='note-kw'>Spec</span>: Requirements→Design→Tasks 3단계 체계적 개발</li><li><span class='note-kw'>Steering</span>: .kiro/steering/ 파일로 팀 규칙·코딩 스타일·도메인 지식 항상 AI에게 제공</li><li><span class='note-kw'>MCP</span>: 외부 도구·API·DB를 AI에 연결. GitHub, Jira, AWS 등</li><li><span class='note-kw'>Hook</span>: 이벤트 기반 자동 실행. 저장·커밋 시 린트·테스트·배포 자동 수행</li><li><span class='note-kw'>Power</span>: 특정 작업에 특화된 기능 확장 팩</li></ul></div><div class='note-case'><div class='note-case-label'>Day 4 심화</div><p>오늘은 개념만 소개합니다. Day 4 오전에 각 장치를 직접 설정하고 실습합니다.</p></div>"},
  {t:'Kiro 구독',h:"<div class='note-section'><div class='note-section-title'>플랜별 비교</div><ul><li><span class='note-kw'>Free</span>: 무료. 월 50 agent sessions. <strong>이번 과정 모든 실습 가능</strong></li><li><span class='note-kw'>Pro</span>: 유료. 무제한 sessions, 우선 지원, 고급 모델</li><li><span class='note-kw'>Enterprise</span>: 팀·기업용. SSO, 관리자 콘솔, SLA</li></ul></div><div class='note-section'><div class='note-section-title'>Agent Session이란</div><p>Kiro가 하나의 과제를 수행하는 단위. Free 플랜 월 50 sessions은 이번 과정에 충분합니다.</p></div>"}
];
